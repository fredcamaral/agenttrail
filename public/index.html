    }else{const at=act.get(n.path)

    }}}

  $('tree').innerHTML=`<div class="tree-head">${esc(M.session.project)}</div>${rows.join('')}<div class="tree-legend"><span class="tree-legend-dot"></span>most recent edit · time since last write${M.treeTruncated?' · large repo — tree abridged':''}</div>`

$('tree').addEventListener('click',e=>{const b=e.target.closest('.tree-row.dir');if(!b)return;const p=b.dataset.path
  if(isFolderOpen(p)){openFolders.delete(p);closedFolders.add(p)}else{closedFolders.delete(p);openFolders.add(p)}
  renderTree();renderTimes()})
function isSkeletonPlan(){return M.plan.filter(n=>n.level==='task').length<=1}
function renderGraph(){
  const phases=M.plan.filter(n=>n.level==='component');if(!phases.length){$('graph').innerHTML='<div class="empty">No phases to map.</div>';return}const byId=Object.fromEntries(phases.map(p=>[p.id,p])),depth={},visiting=new Set()
  function getDepth(p){if(depth[p.id]!=null)return depth[p.id];if(visiting.has(p.id))return 0;visiting.add(p.id);const preds=p.needs.filter(id=>byId[id]);depth[p.id]=preds.length?1+Math.max(...preds.map(id=>getDepth(byId[id]))):0;visiting.delete(p.id);return depth[p.id]}
  phases.forEach(getDepth);const cols={};phases.forEach(p=>(cols[depth[p.id]]??=[]).push(p));const gx=120,gy=48,pad=64,pos={},metrics=Object.fromEntries(phases.map(p=>[p.id,graphNodeMetrics(p)])),columnWidths={}
  for(const[col,list]of Object.entries(cols))columnWidths[col]=Math.max(...list.map(p=>metrics[p.id].w))
  const orderedColumns=Object.keys(cols).map(Number).sort((a,b)=>a-b),columnX={};let nextX=pad

  let maxBottom=pad
  for(const[col,list]of Object.entries(cols)){let nextY=pad;for(const p of list){const size=metrics[p.id],x=columnX[col]+(columnWidths[col]-size.w)/2;pos[p.id]={x,y:nextY,...size,nodeX:x+(size.w-size.nodeW)/2,nodeY:nextY};nextY+=size.h+gy}maxBottom=Math.max(maxBottom,nextY-gy+pad)}

  const seenLinks=new Set(),linkPairs=[]
  for(const p of phases)for(const l of p.links||[]){if(!byId[l])continue;const key=[p.id,l].sort().join('|');if(seenLinks.has(key))continue;seenLinks.add(key);linkPairs.push([byId[l],p])}
  const edges=phases.flatMap(p=>p.needs.map(need=>graphEdge(byId[need],p,pos))).join('')+linkPairs.map(([a,b])=>graphLinkEdge(a,b,pos)).join(''),nodes=phases.map((p,i)=>graphNode(p,i,pos[p.id])).join('')
  $('graph').innerHTML=`<svg class="graph-grid"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#313131"/></pattern></defs><rect width="100%" height="100%" fill="url(#grid)"/></svg><div class="graph-stage" id="graph-stage" onpointerdown="startPan(event)" onpointermove="movePan(event)" onpointerup="endPan(event)" onpointercancel="endPan(event)"><svg class="graph-svg"><title>Plan dependency flow</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#313131"/></marker></defs><g class="world" id="world" transform="translate(${graphPan.x} ${graphPan.y}) scale(${graphZoom})">${edges}${nodes}</g></svg></div><div class="canvas-tools"><button class="icon" aria-label="Zoom out" onclick="zoomBy(.85)"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button><span class="zoom" id="zoom">${Math.round(graphZoom*100)}%</span><button class="icon" aria-label="Zoom in" onclick="zoomBy(1.18)"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button><span class="divider"></span><button class="icon" aria-label="Fit diagram" onclick="fitGraph()"><svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M20 15v5h-5M4 15v5h5"/></svg></button></div>${isSkeletonPlan()?`<div class="firstrun"><p><strong>This plan is still a skeleton.</strong> Your agent draws the real map: copy the prompt, paste it to Claude Code or Codex in this repo, and the board fills in as PLAN.md is written.</p><button class="btn accent" type="button" onclick="copyBackfill()">Copy backfill prompt</button></div>`:''}<div class="canvas-hint"><span class="hint"><span class="key">click</span>${openGraphDetails.size?'Show or hide tasks':'Show tasks below node'}</span><span class="hint"><span class="key">drag</span>Move canvas</span><span class="hint"><span class="key">⌘</span>Scroll to zoom</span></div>`
  $('graph-stage').addEventListener('wheel',onGraphWheel,{passive:false});if(graphNeedsFit){graphNeedsFit=false;requestAnimationFrame(fitGraph)}
}
function graphDetailHeight(p){const list=kids(p.id),openRows=list.filter(graphTaskIsOpen).reduce((a,t)=>a+16+graphTaskDetails(t).rows.length*20,0);return list.length?list.length*44+Math.max(0,list.length-1)+openRows:64}
function graphNodeMetrics(p){const nodeW=400,nodeH=128;if(!openGraphDetails.has(p.id))return{w:nodeW,h:nodeH,nodeW,nodeH,detailW:0,detailH:0};const detailW=400,detailH=graphDetailHeight(p);return{w:detailW,h:nodeH+24+detailH,nodeW,nodeH,detailW,detailH}}
function graphEdge(source,target,pos){if(!source||!pos[source.id]||!pos[target.id])return'';const a=pos[source.id],b=pos[target.id],x1=a.nodeX+a.nodeW,y1=a.nodeY+a.nodeH/2,x2=b.nodeX,y2=b.nodeY+b.nodeH/2,bend=Math.max(48,(x2-x1)/2),active=source.status==='active'||target.status==='active';return`<path class="edge ${active?'active':''}" d="M${x1} ${y1}C${x1+bend} ${y1} ${x2-bend} ${y2} ${x2} ${y2}" marker-end="url(#arrow)"/>`}
function graphLinkEdge(a,b,pos){const A=pos[a.id],B=pos[b.id];if(!A||!B)return''

  if(Math.abs(A.nodeX-B.nodeX)>24){const L=A.nodeX<B.nodeX?A:B,R=A.nodeX<B.nodeX?B:A;x1=L.nodeX+L.nodeW;y1=L.nodeY+L.nodeH/2;x2=R.nodeX;y2=R.nodeY+R.nodeH/2;const mx=(x1+x2)/2;d=`M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`}
  else{const T=A.nodeY<B.nodeY?A:B,Bt=A.nodeY<B.nodeY?B:A;x1=T.nodeX+T.nodeW/2;y1=T.nodeY+T.nodeH;x2=Bt.nodeX+Bt.nodeW/2;y2=Bt.nodeY;const my=(y1+y2)/2;d=`M${x1} ${y1}C${x1} ${my} ${x2} ${my} ${x2} ${y2}`}
  return`<path class="edge link" d="${d}"/>`}
function graphNode(p,index,pos){return collapsedGraphNode(p,index,pos)+(openGraphDetails.has(p.id)?expandedGraphNode(p,pos):'')}
function graphTaskIsOpen(task){if(openGraphTasks.has(task.id))return true;if(closedGraphTasks.has(task.id))return false;return task.status==='active'}
function graphTaskMarker(task,index){if(task.status==='done')return`<span class="task-capsule-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>`;if(task.status==='blocked')return`<span class="task-capsule-badge blocked" aria-hidden="true">!</span>`;return`<span class="task-capsule-marker" aria-hidden="true"><svg viewBox="0 0 24 24"><circle class="ring-track" cx="12" cy="12" r="11"/>${task.status==='active'?'<circle class="ring-live" cx="12" cy="12" r="11"/>':''}</svg><span>${index+1}</span></span>`}
function graphTaskDetails(task){const comp=M.plan.find(x=>x.id===task.parent),compActive=M.plan.some(x=>x.parent===task.parent&&x.status==='active')
  const live=!!(comp&&(comp.recent||[]).length&&(task.status==='active'||task.status==='blocked'||(task.status==='done'&&!compActive)))
  const rows=live?comp.recent.slice(0,4).map(a=>({label:a.file,meta:ago(a.at)})):[]
  if(task.tech)rows.push({label:task.tech,meta:'tech'})
  if(!rows.length)rows.push({label:'No activity recorded yet',meta:''})

function graphTaskRow(task,index){const open=graphTaskIsOpen(task),details=graphTaskDetails(task),pill=task.status==='blocked'?'<span class="task-capsule-pill blocked">Blocked</span>':task.status==='done'?'<span class="task-capsule-pill">Completed</span>':'',amount=task.status==='active'?'Editing now':'';return`<div class="task-capsule ${task.status} ${open?'open':''}" role="listitem" style="animation-delay:${index*80}ms"><button class="task-capsule-button" type="button" aria-expanded="${open}" onclick="toggleGraphTask('${task.id}',event)"><span class="task-capsule-marker-wrap">${graphTaskMarker(task,index)}</span><span class="task-capsule-copy">${esc(task.title)}</span>${task.by?`<span class="agent-chip${task.status==='done'?' faded':''}" style="color:${agentColor(task.by)}" title="${esc(task.by)}">${agentIcon(task.by)?`<svg viewBox="0 0 24 24" width="14" height="14"><path fill="${agentColor(task.by)}" d="${agentIcon(task.by)}"/></svg>`:agentGlyph(task.by)}</span>`:''}${amount?`<span class="task-capsule-amount">${amount}</span>`:''}${pill}<span class="task-capsule-chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span></button><div class="task-capsule-detail"><div class="task-capsule-detail-clip"><div class="task-capsule-detail-grid"><span class="task-capsule-detail-line" aria-hidden="true"></span><div class="task-capsule-detail-list"${details.live?` data-live-comp="${details.comp.id}" data-tech="${esc(task.tech||'')}"`:''}>${details.rows.map((detail,i)=>`<div class="task-capsule-detail-row" style="animation-delay:${120+i*80}ms"><span>${esc(detail.label)}</span><span class="task-capsule-detail-meta">${esc(detail.meta)}</span></div>`).join('')}</div></div></div></div></div>`}
function nodeStatusIcon(p,w){const cx=w-26,cy=26
  if(p.status==='done')return`<g><circle cx="${cx}" cy="${cy}" r="9" fill="#3f7f57"/><path d="M${cx-4.5} ${cy} l3.2 3.2 l6-6.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`

function nodeAgentChips(p,w){const names=[...new Set(M.plan.filter(n=>n.parent===p.id&&(n.status==='active'||n.status==='blocked')&&n.by).map(n=>n.by))].slice(0,3)

function collapsedGraphNode(p,index,pos){const list=kids(p.id),done=list.filter(n=>n.status==='done').length,progress=pct(done,list.length),label=p.title.length>28?`${p.title.slice(0,27)}…`:p.title,isOpen=openGraphDetails.has(p.id),w=pos.nodeW,h=pos.nodeH,obsWord=p.status==='done'?'Revising':p.status==='blocked'?'Retrying':'Editing',chipN=new Set(M.plan.filter(n=>n.parent===p.id&&(n.status==='active'||n.status==='blocked')&&n.by).map(n=>n.by)).size;return`<g class="gnode ${p.status} ${isOpen?'selected':''}" data-id="${p.id}" transform="translate(${pos.nodeX} ${pos.nodeY})" role="button" tabindex="0" aria-expanded="${isOpen}" aria-label="${isOpen?'Hide':'Show'} tasks for ${esc(p.title)}" onclick="toggleGraphNode('${p.id}',event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleGraphNode('${p.id}',event)}"><rect class="node-box" width="${w}" height="${h}" rx="12"/><circle class="port" cx="0" cy="${h/2}" r="4"/><circle class="port" cx="${w}" cy="${h/2}" r="4"/><text class="kicker" x="16" y="24">${esc((p.tech||'#'+p.id).slice(0,42))}</text>${nodeStatusIcon(p,w)}<circle class="obs-ring" cx="${w-26}" cy="26" r="13" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-dasharray="23 59"/><text class="obs-label" x="${w-44-24*Math.min(chipN,3)}" y="30" text-anchor="end" fill="var(--accent)" font-size="11" font-weight="600" font-family="var(--font)">${obsWord}</text>${nodeAgentChips(p,w)}<text class="node-title" x="16" y="52">${esc(label)}</text><text class="node-meta" x="16" y="76">${done} of ${list.length} tasks · ${p.status==='pending'&&done>0?'Underway':statusLabel(p.status)}</text><rect class="progress-bg" x="16" y="92" width="${w-32}" height="4" rx="2"/><rect class="progress" x="16" y="92" width="${(w-32)*progress/100}" height="4" rx="2"/><text class="node-action" x="16" y="116">${isOpen?'HIDE TASKS ↑':'SHOW TASKS ↓'}</text></g>`}

function toggleGraphNode(id,event){event?.stopPropagation();openGraphDetails.has(id)?openGraphDetails.delete(id):openGraphDetails.add(id);graphNeedsFit=true;renderGraph();renderTimes()}
function toggleGraphTask(id,event){event?.stopPropagation();const task=M.plan.find(n=>n.id===id&&n.level==='task');if(!task)return;if(graphTaskIsOpen(task)){openGraphTasks.delete(id);closedGraphTasks.add(id)}else{closedGraphTasks.delete(id);openGraphTasks.add(id)}graphNeedsFit=true;renderGraph();renderTimes()}
function updateTransform(){const world=$('world');if(world)world.setAttribute('transform',`translate(${graphPan.x} ${graphPan.y}) scale(${graphZoom})`);if($('zoom'))$('zoom').textContent=`${Math.round(graphZoom*100)}%`}
function fitGraph(){const stage=$('graph-stage');if(!stage||!graphSize.width)return;const box=stage.getBoundingClientRect();graphZoom=Math.max(.45,Math.min(1.2,(box.width-128)/graphSize.width,(box.height-128)/graphSize.height));graphPan={x:(box.width-graphSize.width*graphZoom)/2,y:(box.height-graphSize.height*graphZoom)/2};updateTransform()}

function onGraphWheel(e){e.preventDefault();const box=e.currentTarget.getBoundingClientRect();if(e.metaKey||e.ctrlKey)zoomBy(e.deltaY<0?1.08:.92,{x:e.clientX-box.left,y:e.clientY-box.top});else{graphPan.x-=e.deltaX;graphPan.y-=e.deltaY;updateTransform()}}

function copy(q){navigator.clipboard.writeText(q).then(()=>{const t=$('toast');t.textContent='Prompt copied — paste it to your agent in this repo';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)})}
function copyBackfill(){copy('Read the "agenttrail plan convention" section in CLAUDE.md or AGENTS.md. Then study this repo — README, roadmap/design docs, and the directory layout — and rewrite PLAN.md as the real map of this codebase: components with stable {#id}s, needs:/links: edges between them, files: globs for the paths each owns, and verb-led concrete titles with tech: sublines. Keep it to 5-9 components no matter how big the repo — a component is a part one agent could own for a session, with its own doneness and at least one edge; anything smaller is a task inside one, and stable plumbing folds into a neighbor while active or planned areas get their own card. Statuses must be honest — [x] only for what verifiably exists, [~] only for what you are working on right now, everything else [ ]. Record the backfill under ## decisions.')}

function renderObserved(){const now=Date.now();const live={};for(const n of M.plan)if(n.level==='component')live[n.id]=n.touchedAt&&now-n.touchedAt<60000
