0%;color:#fff;background:#3f7f57;animation:capsule-pop 300ms var(--ease-out) both}.task-capsule-badge svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.task-capsule-copy{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:16px;font-weight:500}.task-capsule-amount{flex:none;color:var(--dim);font-size:12px;line-height:16px;font-variant-numeric:tabular-nums}.task-capsule-pill{display:inline-flex;flex:none;align-items:center;height:22px;padding:0 8px;border-radius:999px;color:#70a784;background:rgba(63,127,87,.18);font-size:11px;line-height:16px;font-weight:500}.task-capsule-pill.revised{color:var(--accent);background:var(--accent-bg)}.task-capsule-chevron{display:flex;flex:none;align-items:center;justify-content:center;width:28px;height:28px;margin-left:-8px;border-radius:50%;color:var(--faint)}.task-capsule-chevron svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform 250ms var(--ease-out)}.task-capsule.open .task-capsule-chevron svg{transform:rotate(180deg)}.task-capsule-detail{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows 250ms var(--ease-out),opacity 200ms var(--ease-out)}.task-capsule.open .task-capsule-detail{grid-template-rows:1fr;opacity:1}.task-capsule-detail-clip{overflow:hidden}.task-capsule-detail-grid{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;margin-bottom:12px;padding:0 8px}.task-capsule-detail-line{width:1px;height:100%;margin:auto;background:var(--line)}.task-capsule-detail-list{display:flex;min-width:0;flex-direction:column;gap:4px}.task-capsule-detail-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:20px;color:var(--dim);font-size:12px;line-height:16px;animation:capsule-detail-enter 300ms var(--ease-out) both}.task-capsule-detail-meta{overflow:hidden;color:var(--fai @media(max-width:960px){.topbar{grid-template-columns:minmax(0,1fr) auto}.switcher{grid-column:1/-1;grid-row:2}.tab{flex:1;justify-content:center}.workspace{height:calc(100dvh - 113px);grid-template-columns:minmax(0,1fr) 288px}.watching{display:none}.plan-view{padding:32px 24px 64px}}@media(max-width:720px){.topbar{padding:8px 12px;gap:12px}.badge{max-width:128px;overflow:hidden;text-overflow:ellipsis}.workspace{display:block;height:auto;min-height:calc(100dvh - 105px);overflow:visible}.primary{min-height:calc(100dvh - 105px)}.plan-view{padding:32px 16px 64px}.intro{display:block}.summary{margin-top:24px;text-align:left}.phase-head{grid-template-columns:auto minmax(0,1fr) auto;gap:12px}.phase-meta{display:none}.phase-body{padding-left:12px}.inspector{position:relative;left:auto;right:auto;bottom:auto;max-height:none;margin:0 12px 12px;border:1px solid var(--line);border-radius:16px}.graph-view{min-height:calc(100dvh - 105px)}.canvas-hint{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}

<body>
<a class="skip" href="#main-view">Skip to plan</a>
<div class="app"><header class="topbar">
  <div class="brand"><div class="mark" aria-hidden="true"><span></span></div><div class="project"><div class="project-name" id="proj">agenttrail</div><div class="file-name">workspace / PLAN.md</div></div></div>
  <nav class="switcher" aria-label="Workspace view">
    <button class="tab on" id="tg-plan" type="button" onclick="setView('plan')"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><rect x="3" y="5" width="2" height="2" rx=".5"/><rect x="3" y="11" width="2" height="2" rx=".5"/><rect x="3" y="17" width="2" height="2" rx=".5"/></svg>Plan</button>
    <button class="tab" id="tg-graph" type="button" onclick="setView('graph')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="6" height="5" rx="1"/><rect x="15" y="15" width="6" height="5" rx="1"/><path d="M9 6.5h3a3 3 0 0 1 3 3v5.5"/></svg>Flow diagram</button>
  </nav>
  <div class="status"><span id="state"></span><span class="watching">watching</span></div>
</header>
<div class="workspace"><main class="primary plan-view" id="plan"><div class="empty"><div><strong>Connecting to your plan</strong><br>Waiting for the live monitor.</div></div></main><section class="primary graph-view" id="graph" aria-label="Plan flow diagram" hidden></section><aside class="inspector" id="inspector" aria-label="Plan details"><div class="all-clear"><div class="clear-mark">···</div><h2>Starting monitor</h2><p>agenttrail is connecting to PLAN.md.</p></div></aside></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
let M=null,view='plan',selectedId=null,graphZoom=1,graphPan={x:0,y:0},graphSize={width:0,height:0},graphNeedsFit=true,panGesture=null
const openGraphDetails=new Set(),openGraphTasks=new Set(),closedGraphTasks=new Set()
const userOpen=new Set(),userClosed=new Set(),$=id=>document.getElementById(id)
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const ago=ms=>{const s=Math.max(0,Math.round((Date.now()-ms)/1000));return s<60?`${s}s`:s<3600?`${Math.round(s/60)} min`:`${Math.round(s/3600)} h`}
const statusLabel=s=>s==='done'?'Complete':s==='active'?'In progress':'Queued',pct=(done,total)=>total?Math.round(done/total*100):0
const es=new EventSource('/events');let connectionTimer=null
es.onopen=()=>clearTimeout(connectionTimer)
es.onmessage=e=>{clearTimeout(connectionTimer);M=JSON.parse(e.data);if(selectedId&&!M.plan.some(n=>n.id===selectedId))selectedId=null;for(const id of [...openGraphDetails])if(!M.plan.some(n=>n.id===id&&n.level==='phase'))openGraphDetails.delete(id);for(const set of [openGraphTasks,closedGraphTasks])for(const id of [...set])if(!M.plan.some(n=>n.id===id&&n.level==='task'))set.delete(id);render()}
es.onerror=()=>{if(!M){clearTimeout(connectionTimer);connectionTimer=setTimeout(renderConnectionError,1200)}}
setInterval(()=>{if(M)renderTimes()},1000)
function isOpen(p){if(userClosed.has(p.id))return false;if(userOpen.has(p.id))return true;return p.status==='active'}
function kids(id){return M.plan.filter(n=>n.parent===id)}
function render(){
  $('proj').textContent=M.session.project;$('state').innerHTML='<span class="badge"><span class="dot"></span>Plan is live</span>'
  favicon('#7aa36a');document.title=`agenttrail · ${M.session.project}`;$('tg-plan').classList.toggle('on',view==='plan');$('tg-graph').classList.toggle('on',view==='graph');$('plan').hidden=view!=='plan';$('graph').hidden=view!=='graph';document.querySelector('.workspace').classList.toggle('graph-mode',view==='graph');if(view==='plan'){renderPlan();renderInspector()}else renderGraph();renderTimes()
}
function renderConnectionError(){
  $('state').innerHTML='<span class="badge changed"><span class="dot"></span>Not connected</span>'
  $('plan').innerHTML='<div class="empty"><div><strong>Could not reach the live monitor</strong><br>Start agenttrail, then open this page from its local address.</div></div>'
  $('inspector').innerHTML='<div class="all-clear"><div class="clear-mark">×</div><h2>No plan data</h2><p>This interface needs the local agenttrail server. Opening index.html directly will not work.</p></div>'
}
function setView(v){if(view===v)return;view=v;graphNeedsFit=v==='graph';render()}
function renderPlan(){
  if(!M.hasPlan){$('plan').innerHTML=`<div class="empty"><div><strong>No plan found</strong><br>Run <code>agenttrail init</code> in this repository.</div></div>`;return}
  const phases=M.plan.filter(n=>n.level==='phase'),tasks=M.plan.filter(n=>n.level==='task'),done=tasks.filter(n=>n.status==='done').length,progress=pct(done,tasks.length),active=tasks.find(n=>n.status==='active')
  $('plan').innerHTML=`<div class="plan-inner" id="main-view"><div class="intro"><div><div class="eyebrow">Live plan</div><h1 class="title">${esc(M.planTitle||M.session.project)}</h1><p class="subtitle">${active?`The agent is working on ${esc(active.title)}. Open a phase to inspect its tasks and recent file activity.`:'No task is active right now. The plan will update here as work resumes.'}</p></div><div class="summary" aria-label="${progress} percent complete"><div class="summary-value">${progress}%</div><div class="summary-label">${done} of ${tasks.length} tasks complete</div><div class="track"><div class="fill" style="transform:scaleX(${progress/100})"></div></div></div></div><div class="phases">${phases.map(renderPhase).join('')}</div></div>`
}
function renderPhase(p,index){
  const list=kids(p.id),done=list.filter(n=>n.status==='done').length,open=isOpen(p)
  return `<article class="phase ${open?'open':''} ${selectedId===p.id?'selected':''}"><button class="phase-head" type="button" aria-expanded="${open}" onclick="togglePhase('${p.id}')"><span class="phase-index">${String(index+1).padStart(2,'0')}</span><span class="phase-copy"><span class="phase-title">${esc(p.title)}</span><span class="phase-detail">${statusLabel(p.status)}${p.needs.length?` · ${p.needs.length} dependenc${p.needs.length===1?'y':'ies'}`:''}</span></span><span class="phase-meta"><span class="meter"><span style="width:${pct(done,list.length)}%"></span></span><span>${done}/${list.length}</span></span><span class="chev"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span></button><div class="phase-body">${list.length?`<div class="tasks">${list.map(renderTask).join('')}</div>`:'<div class="empty">No tasks in this phase.</div>'}</div></article>`
}
function renderTask(t){
  const active=t.status==='active',activity=active&&M.recentActivity.length?`<div class="activity">${M.recentActivity.slice(0,4).map(a=>`<div class="activity-line"><span class="pulse">●</span><span class="activity-file">${esc(a.file)}</span><span class="activity-time t-ago" data-at="${a.at}"></span></div>`).join('')}</div>`:''
  return `<div><button class="task ${t.status} ${selectedId===t.id?'selected':''}" type="button" onclick="selectNode('${t.id}')"><span class="box"></span><span class="task-copy"><span class="task-title">${esc(t.title)}</span></span><span class="task-meta ${active?'current':''}">${active?'Editing now':statusLabel(t.status)}</span></button>${activity}</div>`
}
function togglePhase(id){const p=M.plan.find(n=>n.id===id);if(!p)return;if(isOpen(p)){userOpen.delete(id);userClosed.add(id)}else{userClosed.delete(id);userOpen.add(id)}selectedId=id;renderPlan();renderInspector()}
function selectNode(id,event){event?.stopPropagation();selectedId=id;const n=M.plan.find(x=>x.id===id);if(n?.parent){userClosed.delete(n.parent);userOpen.add(n.parent)}view==='plan'?renderPlan():renderGraph();renderInspector()}
function clearSelection(){selectedId=null;view==='plan'?renderPlan():renderGraph();renderInspector()}
function renderInspector(){
  const node=selectedId?M.plan.find(n=>n.id===selectedId):null;if(node){$('inspector').innerHTML=nodeInspector(node);return}
  $('inspector').innerHTML=`<div class="all-clear"><div class="clear-mark">●</div><h2>Plan is live</h2><p>Task progress updates automatically as the agent works.</p></div>${recentActivity()}`
}
function nodeInspector(n){
  const isPhase=n.level==='phase',list=isPhase?kids(n.id):[],done=list.filter(x=>x.status==='done').length,parent=n.parent?M.plan.find(x=>x.id===n.parent):null,deps=n.needs.map(id=>M.plan.find(x=>x.id===id)).filter(Boolean)
  const relations=deps.length||parent?`<section class="section"><div class="section-label">Connected to</div><div class="dependencies">${parent?`<div class="dependency">Inside ${esc(parent.title)}</div>`:''}${deps.map(x=>`<div class="dependency">After ${esc(x.title)}</div>`).join('')}</div></section>`:''
  const taskDetail=isPhase&&list.length?`<section class="section"><div class="section-label">Tasks</div><div class="detail-tasks">${list.map(task=>`<button class="detail-task ${task.status}" type="button" onclick="selectNode('${task.id}')"><span class="box"></span><span class="task-title">${esc(task.title)}</span><span class="task-meta ${task.status==='active'?'current':''}">${statusLabel(task.status)}</span></button>`).join('')}</div></section>`:''
  return `<div class="inspector-top"><div class="inspector-heading"><div class="inspector-kicker">${isPhase?'Phase details':'Task details'} · ${statusLabel(n.status)}</div><h2 class="inspector-title">${esc(n.title)}</h2><p class="inspector-sub">${isPhase?'Select a task below to inspect it.':'Plan item'} · ${esc(n.id)}</p></div><button class="icon" aria-label="Close details" onclick="clearSelection()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>${isPhase?`<section class="section"><div class="section-label">Progress</div><div class="stats"><div class="stat"><div class="stat-value">${done}/${list.length}</div><div class="stat-label">Tasks complete</div></div><div class="stat"><div class="stat-value">${pct(done,list.length)}%</div><div class="stat-label">Phase progress</div></div></div></section>`:''}${taskDetail}${relations}${n.status==='active'?recentActivity():''}`
}
function recentActivity(){if(!M.recentActivity.length)return'';const a=M.recentActivity[0];return`<section class="section"><div class="section-label">Latest repository activity</div><div class="activity-card"><strong>${esc(a.file)}</strong><span class="t-ago" data-at="${a.at}"></span> ago</div></section>`}
function renderGraph(){
  const phases=M.plan.filter(n=>n.level==='phase');if(!phases.length){$('graph').innerHTML='<div class="empty">No phases to map.</div>';return}const byId=Object.fromEntries(phases.map(p=>[p.id,p])),depth={},visiting=new Set()
  function getDepth(p){if(depth[p.id]!=null)return depth[p.id];if(visiting.has(p.id))return 0;visiting.add(p.id);const preds=p.needs.filter(id=>byId[id]);depth[p.id]=preds.length?1+Math.max(...preds.map(id=>getDepth(byId[id]))):0;visiting.delete(p.id);return depth[p.id]}
  phases.forEach(getDepth);const cols={};phases.forEach(p=>(cols[depth[p.id]]??=[]).push(p));const gx=120,gy=48,pad=64,pos={},metrics=Object.fromEntries(phases.map(p=>[p.id,graphNodeMetrics(p)])),columnWidths={}
  for(const[col,list]of Object.entries(cols))columnWidths[col]=Math.max(...list.map(p=>metrics[p.id].w))
  const orderedColumns=Object.keys(cols).map(Number).sort((a,b)=>a-b),columnX={};let nextX=pad
  for(const col of orderedColumns){columnX[col]=nextX;nextX+=columnWidths[col]+gx}
  let maxBottom=pad
  for(const[col,list]of Object.entries(cols)){let nextY=pad;for(const p of list){const size=metrics[p.id],x=columnX[col]+(columnWidths[col]-size.w)/2;pos[p.id]={x,y:nextY,...size,nodeX:x+(size.w-size.nodeW)/2,nodeY:nextY};nextY+=size.h+gy}maxBottom=Math.max(maxBottom,nextY-gy+pad)}
  graphSize={width:nextX-gx+pad,height:maxBottom}
  const edges=phases.flatMap(p=>p.needs.map(need=>graphEdge(byId[need],p,pos))).join(''),nodes=phases.map((p,i)=>graphNode(p,i,pos[p.id])).join('')
  $('graph').innerHTML=`<svg class="graph-grid"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#313131"/></pattern></defs><rect width="100%" height="100%" fill="url(#grid)"/></svg><div class="graph-stage" id="graph-stage" onpointerdown="startPan(event)" onpointermove="movePan(event)" onpointerup="endPan(event)" onpointercancel="endPan(event)"><svg class="graph-svg"><title>Plan dependency flow</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#313131"/></marker></defs><g class="world" id="world" transform="translate(${graphPan.x} ${graphPan.y}) scale(${graphZoom})">${edges}${nodes}</g></svg></div><div class="canvas-tools"><button class="icon" aria-label="Zoom out" onclick="zoomBy(.85)"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button><span class="zoom" id="zoom">${Math.round(graphZoom*100)}%</span><button class="icon" aria-label="Zoom in" onclick="zoomBy(1.18)"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button><span class="divider"></span><button class="icon" aria-label="Fit diagram" onclick="fitGraph()"><svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M20 15v5h-5M4 15v5h5"/></svg></button></div><div class="canvas-hint"><span class="hint"><span class="key">click</span>${openGraphDetails.size?'Show or hide tasks':'Show tasks below node'}</span><span class="hint"><span class="key">drag</span>Move canvas</span><span class="hint"><span class="key">⌘</span>Scroll to zoom</span></div>`
  $('graph-stage').addEventListener('wheel',onGraphWheel,{passive:false});if(graphNeedsFit){graphNeedsFit=false;requestAnimationFrame(fitGraph)}
}
function graphDetailHeight(p){const list=kids(p.id),open=list.filter(graphTaskIsOpen).length;return list.length?list.length*44+Math.max(0,list.length-1)+open*56:64}
function graphNodeMetrics(p){const nodeW=400,nodeH=128;if(!openGraphDetails.has(p.id))return{w:nodeW,h:nodeH,nodeW,nodeH,detailW:0,detailH:0};const detailW=400,detailH=graphDetailHeight(p);return{w:detailW,h:nodeH+24+detailH,nodeW,nodeH,detailW,detailH}}
function graphEdge(source,target,pos){if(!source||!pos[source.id]||!pos[target.id])return'';const a=pos[source.id],b=pos[target.id],x1=a.nodeX+a.nodeW,y1=a.nodeY+a.nodeH/2,x2=b.nodeX,y2=b.nodeY+b.nodeH/2,bend=Math.max(48,(x2-x1)/2),active=source.status==='active'||target.status==='active';return`<path class="edge ${active?'active':''}" d="M${x1} ${y1}C${x1+bend} ${y1} ${x2-bend} ${y2} ${x2} ${y2}" marker-end="url(#arrow)"/>`}
function graphNode(p,index,pos){return collapsedGraphNode(p,index,pos)+(openGraphDetails.has(p.id)?expandedGraphNode(p,pos):'')}
function graphTaskIsOpen(task){if(openGraphTasks.has(task.id))return true;if(closedGraphTasks.has(task.id))return false;return task.status==='active'}
function graphTaskMarker(task,index){if(task.status==='done')return`<span class="task-capsule-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>`;return`<span class="task-capsule-marker" aria-hidden="true"><svg viewBox="0 0 24 24"><circle class="ring-track" cx="12" cy="12" r="11"/>${task.status==='active'?'<circle class="ring-live" cx="12" cy="12" r="11"/>':''}</svg><span>${index+1}</span></span>`}
function graphTaskDetails(task){const latest=task.status==='active'&&M.recentActivity.length?M.recentActivity[0]:null,secondLabel=latest?'Latest file':'Plan item',secondMeta=latest?latest.file:task.id;return[{label:'Plan status',meta:statusLabel(task.status)},{label:secondLabel,meta:secondMeta}]}
function graphTaskRow(task,index){const open=graphTaskIsOpen(task),details=graphTaskDetails(task),pill=task.status==='done'?'<span class="task-capsule-pill">Completed</span>':'',amount=task.status==='active'?'Editing now':task.status==='pending'?'Queued':'';return`<div class="task-capsule ${task.status} ${open?'open':''}" role="listitem" style="animation-delay:${index*80}ms"><button class="task-capsule-button" type="button" aria-expanded="${open}" onclick="toggleGraphTask('${task.id}',event)"><span class="task-capsule-marker-wrap">${graphTaskMarker(task,index)}</span><span class="task-capsule-copy">${esc(task.title)}</span>${amount?`<span class="task-capsule-amount">${amount}</span>`:''}${pill}<span class="task-capsule-chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span></button><div class="task-capsule-detail"><div class="task-capsule-detail-clip"><div class="task-capsule-detail-grid"><span class="task-capsule-detail-line" aria-hidden="true"></span><div class="task-capsule-detail-list">${details.map((detail,i)=>`<div class="task-capsule-detail-row" style="animation-delay:${120+i*80}ms"><span>${esc(detail.label)}</span><span class="task-capsule-detail-meta">${esc(detail.meta)}</span></div>`).join('')}</div></div></div></div></div>`}
function collapsedGraphNode(p,index,pos){const list=kids(p.id),done=list.filter(n=>n.status==='done').length,progress=pct(done,list.length),label=p.title.length>28?`${p.title.slice(0,27)}…`:p.title,isOpen=openGraphDetails.has(p.id),w=pos.nodeW,h=pos.nodeH;return`<g class="gnode ${p.status} ${isOpen?'selected':''}" transform="translate(${pos.nodeX} ${pos.nodeY})" role="button" tabindex="0" aria-expanded="${isOpen}" aria-label="${isOpen?'Hide':'Show'} tasks for ${esc(p.title)}" onclick="toggleGraphNode('${p.id}',event)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleGraphNode('${p.id}',event)}"><rect class="node-box" width="${w}" height="${h}" rx="12"/><circle class="port" cx="0" cy="${h/2}" r="4"/><circle class="port" cx="${w}" cy="${h/2}" r="4"/><text class="kicker" x="16" y="24">PHASE ${String(index+1).padStart(2,'0')}</text><text class="node-title" x="16" y="52">${esc(label)}</text><text class="node-meta" x="16" y="76">${done} of ${list.length} tasks · ${statusLabel(p.status)}</text><rect class="progress-bg" x="16" y="92" width="${w-32}" height="4" rx="2"/><rect class="progress" x="16" y="92" width="${(w-32)*progress/100}" height="4" rx="2"/><text class="node-action" x="16" y="116">${isOpen?'HIDE TASKS ↑':'SHOW TASKS ↓'}</text></g>`}
function expandedGraphNode(p,pos){
  const list=kids(p.id),detailY=pos.nodeY+pos.nodeH+24,centerX=pos.nodeX+pos.nodeW/2,tasks=list.length?`<div class="task-capsules list" role="list" aria-label="${esc(p.title)} tasks">${list.map(graphTaskRow).join('')}</div>`:'<div class="graph-task-empty">No tasks in this phase.</div>'
  return`<path class="detail-tether" d="M${centerX} ${pos.nodeY+pos.nodeH}V${detailY}"/><g class="graph-detail" transform="translate(${pos.x} ${detailY})"><foreignObject width="${pos.detailW}" height="${pos.detailH}"><div xmlns="http://www.w3.org/1999/xhtml" class="graph-task-card">${tasks}</div></foreignObject></g>`
}
function toggleGraphNode(id,event){event?.stopPropagation();openGraphDetails.has(id)?openGraphDetails.delete(id):openGraphDetails.add(id);graphNeedsFit=true;renderGraph();renderTimes()}
function toggleGraphTask(id,event){event?.stopPropagation();const task=M.plan.find(n=>n.id===id&&n.level==='task');if(!task)return;if(graphTaskIsOpen(task)){openGraphTasks.delete(id);closedGraphTasks.add(id)}else{closedGraphTasks.delete(id);openGraphTasks.add(id)}graphNeedsFit=true;renderGraph();renderTimes()}
function updateTransform(){const world=$('world');if(world)world.setAttribute('transform',`translate(${graphPan.x} ${graphPan.y}) scale(${graphZoom})`);if($('zoom'))$('zoom').textContent=`${Math.round(graphZoom*100)}%`}
function fitGraph(){const stage=$('graph-stage');if(!stage||!graphSize.width)return;const box=stage.getBoundingClientRect();graphZoom=Math.max(.45,Math.min(1.2,(box.width-128)/graphSize.width,(box.height-128)/graphSize.height));graphPan={x:(box.width-graphSize.width*graphZoom)/2,y:(box.height-graphSize.height*graphZoom)/2};updateTransform()}
function zoomBy(factor,origin){const stage=$('graph-stage');if(!stage)return;const box=stage.getBoundingClientRect(),point=origin||{x:box.width/2,y:box.height/2},next=Math.max(.4,Math.min(1.8,graphZoom*factor)),wx=(point.x-graphPan.x)/graphZoom,wy=(point.y-graphPan.y)/graphZoom;graphPan={x:point.x-wx*next,y:point.y-wy*next};graphZoom=next;updateTransform()}
function onGraphWheel(e){e.preventDefault();const box=e.currentTarget.getBoundingClientRect();if(e.metaKey||e.ctrlKey)zoomBy(e.deltaY<0?1.08:.92,{x:e.clientX-box.left,y:e.clientY-box.top});else{graphPan.x-=e.deltaX;graphPan.y-=e.deltaY;updateTransform()}}
function startPan(e){if(e.target.closest('.gnode,.graph-detail'))return;const stage=$('graph-stage');stage.setPointerCapture(e.pointerId);stage.classList.add('dragging');panGesture={id:e.pointerId,x:e.clientX,y:e.clientY,panX:graphPan.x,panY:graphPan.y}}
function movePan(e){if(!panGesture||panGesture.id!==e.pointerId)return;graphPan={x:panGesture.panX+e.clientX-panGesture.x,y:panGesture.panY+e.clientY-panGesture.y};updateTransform()}
function endPan(e){if(!panGesture||panGesture.id!==e.pointerId)return;$('graph-stage')?.classList.remove('dragging');panGesture=null}
function renderTimes(){for(const el of document.querySelectorAll('.t-ago'))el.textContent=ago(+el.dataset.at)}
function favicon(color){$('fav').href='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="3" fill="${color}"/></svg>`)}
window.addEventListener('resize',()=>{if(view==='graph')fitGraph()})
</script>
</body>
</html>
