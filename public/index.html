<style>
:root{color-scheme:dark;--bg:#000;--surface:#181818;--raised:#1f1f1f;--hover:#272727;--line:#313131;--text:#fff;--soft:#d1d1d1;--dim:#9b9b9b;--faint:#686868;--accent:#e9a23b;--accent-bg:#2e220f;--danger:#db6b67;--success:#7aa36a;--complete-text:#70a784;--complete-bg:rgba(63,127,87,.18);--complete-weight:500;--working-border:#1d2b22;--working-bg:#141f18;--watch-ring:#172015;--overlay:#181818;--shadow-soft:rgba(0,0,0,.24);--shadow-strong:#000;--agent-openai:#e8e8ea;--font:"Geist","Manrope",sans-serif;--mono:"Geist Mono",monospace;--ease:cubic-bezier(.32,.72,0,1);--ease-out:cubic-bezier(.23,1,.32,1)}
:root[data-theme="light"]{color-scheme:light;--bg:#fff;--surface:rgb(0 0 0/.025);--raised:rgb(0 0 0/.05);--hover:rgb(0 0 0/.07);--line:rgb(0 0 0/.14);--text:#000;--soft:rgb(0 0 0/.78);--dim:#666;--faint:rgb(0 0 0/.48);--accent:color-mix(in srgb,#e9a23b 64%,#000);--accent-bg:rgb(233 162 59/.16);--success:#3f7f57;--complete-text:#3f7f57;--complete-bg:rgb(63 127 87/.18);--complete-weight:600;--working-border:rgb(63 127 87/.24);--working-bg:rgb(63 127 87/.10);--watch-ring:rgb(63 127 87/.14);--overlay:#fbfaf8;--shadow-soft:rgb(0 0 0/.10);--shadow-strong:rgb(0 0 0/.14);--agent-openai:#313131}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{min-width:320px;min-height:100dvh;background:var(--bg);color:var(--text);font:400 14px/20px var(--font);letter-spacing:-.01em}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.025;z-index:4;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}
button{font:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;min-height:64px;padding:12px 24px;background:var(--bg);border-bottom:1px solid var(--hover)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none;width:28px;height:28px;border-radius:7px}
.brand-name{font-weight:600}
.brand-host{color:var(--dim);font:400 12px/16px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{display:flex;justify-self:end;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;color:var(--dim);white-space:nowrap;font-size:12px;line-height:16px}
.badge.working{border-color:var(--working-border);color:var(--success);background:var(--working-bg)}
.badge.working .dot{background:var(--success);animation:working-pulse 1.6s ease-in-out infinite}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
@keyframes working-pulse{50%{opacity:.35}}
.watching{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:12px}
.watching:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px var(--watch-ring)}
.watching.off:before{background:var(--danger);box-shadow:none}
.theme-toggle{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--dim);cursor:pointer;font-size:12px;line-height:16px;font-weight:500;transition:color 250ms var(--ease-out),background 250ms var(--ease-out)}
.theme-toggle:hover{color:var(--text);background:var(--hover)}
.theme-toggle:active{transform:scale(.98)}
.theme-track{position:relative;width:32px;height:16px;border-radius:8px;background:var(--hover);box-shadow:inset 0 0 0 1px var(--line);transition:background 250ms var(--ease-out)}
.theme-thumb{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:4px;background:var(--dim);transition:transform 250ms var(--ease-out),background 250ms var(--ease-out)}
:root[data-theme="light"] .theme-track{background:var(--accent-bg)}
:root[data-theme="light"] .theme-thumb{transform:translateX(16px);background:var(--accent)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));padding:20px 24px 64px}
.empty{padding:64px 24px;color:var(--dim);text-align:center}
.card{position:relative;padding:12px 14px 12px 28px;border:1px solid var(--line);border-radius:14px;background:var(--overlay);box-shadow:0 12px 40px var(--shadow-strong);animation:reveal 500ms var(--ease) both}
.card:before{content:"";position:absolute;left:12px;top:17px;width:6px;height:6px;border-radius:50%;background:var(--faint)}
.card.busy:before{background:var(--success);animation:working-pulse 1.6s ease-in-out infinite}
.card.idle:before{background:var(--accent)}
.card.shell:before{background:var(--dim)}
.card.ended{opacity:.55;box-shadow:none}
@keyframes reveal{from{opacity:0;transform:translateY(16px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
.card-head{display:flex;align-items:center;gap:8px;min-width:0}
.name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src{display:inline-flex;flex:none;align-items:center;gap:4px;padding:1px 6px;border-radius:999px;background:var(--surface);font:600 10px/16px var(--mono);letter-spacing:.04em;text-transform:uppercase}
.src svg{width:11px;height:11px}
.elapsed{margin-left:auto;flex:none;color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.title{margin-top:6px;color:var(--text);font-size:12.5px;line-height:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title.none{color:var(--dim)}
.meta{margin-top:5px;color:var(--dim);font:400 11.5px/16px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .br{color:var(--accent)}
.meta .sep{color:var(--faint)}
.tool{display:flex;gap:8px;align-items:baseline;margin-top:5px;color:var(--dim);font:400 11.5px/16px var(--mono);overflow:hidden;white-space:nowrap}
.tool .tn{color:var(--accent);flex:none}
.tool .td{overflow:hidden;text-overflow:ellipsis}
.tool .ta{margin-left:auto;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;padding-top:8px;border-top:1px solid var(--hover);color:var(--faint);font:400 11px/16px var(--mono);font-variant-numeric:tabular-nums}
.stats b{color:var(--soft);font-weight:600}
.stats .ok{color:var(--complete-text);font-weight:var(--complete-weight)}
.stats .run{color:var(--success)}
.foot{display:flex;align-items:center;gap:8px;margin-top:8px;min-height:24px}
.pr{padding:1px 7px;border-radius:999px;color:var(--accent);background:var(--accent-bg);font:600 11px/16px var(--mono);text-decoration:none}
.pr:hover{color:var(--text)}
.dl{position:relative;margin-left:auto}
.dl>summary{display:flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--line);border-radius:8px;color:var(--dim);cursor:pointer;list-style:none;font-size:11px;line-height:16px}
.dl>summary::-webkit-details-marker{display:none}
.dl>summary:hover{color:var(--text);background:var(--hover)}
.dl-menu{position:absolute;right:0;bottom:calc(100% + 6px);z-index:2;display:flex;flex-direction:column;min-width:148px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--raised);box-shadow:0 12px 40px var(--shadow-strong)}
.dl-menu a{padding:6px 10px;border-radius:6px;color:var(--soft);text-decoration:none;font-size:12px}
.dl-menu a:hover{color:var(--text);background:var(--hover)}
@media(max-width:720px){.topbar{grid-template-columns:minmax(0,1fr);gap:8px}.status{justify-self:start}.grid{grid-template-columns:minmax(0,1fr);padding:16px 12px 48px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

<script>

function toggleTheme(){const next=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=next;try{localStorage.setItem('at-theme',next)}catch{}syncTheme()}
syncTheme()
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const ago=ms=>{const s=Math.max(0,Math.round((Date.now()-ms)/1000));return s<60?`${s}s`:s<3600?`${Math.round(s/60)} min`:s<86400?`${Math.round(s/3600)} h`:`${Math.round(s/86400)} d`}

.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z'}
// own-property lookups only: a daemon string like "constructor" must not
// resolve to an inherited prototype value and leak into markup or a count.
const own=(o,k)=>Object.hasOwn(o,String(k))?o[String(k)]:null
function agentIcon(n){return own(AGENT_ICONS,String(n).toLowerCase())}
function agentGlyph(n){return String(n||'?')[0].toUpperCase()}
function agentColor(n){const k=String(n||'').toLowerCase(),c=own(AGENT_COLORS,k);if(c)return c;let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))%360;return`hsl(${h} 45% 45%)`}
const RANK={busy:0,idle:1,shell:2,ended:3}
const stat=s=>Object.hasOwn(RANK,String(s.status))?String(s.status):'ended'
const num=(v,d)=>v!=null&&Number.isFinite(+v)?+v:d
const base=p=>String(p??'').replace(/\/+$/,'').split('/').pop()
const money=n=>'$'+(n>=100?String(Math.round(n)):n.toFixed(2))
const href=u=>/^https?:\/\//i.test(String(u??''))?String(u):'#'
let S=new Map()
const cards=new Map()

function srcBadge(src){const c=agentColor(src),ic=agentIcon(src)
  return`<span class="src" style="color:${c}">${ic?`<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="${c}" d="${ic}"/></svg>`:esc(agentGlyph(src))}${esc(src||'?')}</span>`}

function cardHtml(s){
  const tool=s.currentTool||(s.recentTools||[])[0]
  const todos=s.todos||[],tdone=todos.filter(t=>t.status==='completed').length
  // list views trim agents[]; agentCount/agentsRunning carry the honest totals
  const agents=s.agents||[]
  const an=num(s.agentCount,agents.length),arun=num(s.agentsRunning,agents.filter(a=>a.status==='running').length)
  const stats=[]
  if(s.cost&&Number.isFinite(+s.cost.totalUSD))stats.push(`<span><b>${money(+s.cost.totalUSD)}</b></span>`)
  if(+s.turns>0)stats.push(`<span><b>${+s.turns}</b> turns</span>`)
  if(todos.length)stats.push(`<span${tdone===todos.length?' class="ok"':''}>todos <b>${tdone}/${todos.length}</b></span>`)
  if(an)stats.push(`<span>agents <b>${an}</b>${arun?` <span class="run">${arun} running</span>`:''}</span>`)
  if(+s.lastEventAt>0)stats.push(`<span title="since the last transcript event">seen <span class="t-ago" data-at="${+s.lastEventAt}"></span></span>`)
  const prs=(s.prs||[]).slice(0,4).map(p=>`<a class="pr" href="${esc(href(p.url))}" target="_blank" rel="noopener noreferrer" title="${esc(p.repo||'')}">#${esc(p.number)}</a>`).join('')
  const q=encodeURIComponent(String(s.id??''))
  return`<div class="card-head">${srcBadge(s.source)}<span class="name">${esc(s.name||s.title||s.id)}</span><span class="elapsed" title="since the session started">${+s.startedAt>0?`<span class="t-ago" data-at="${+s.startedAt}"></span>`:''}</span></div>
    <div class="title${s.title?'':' none'}">${esc(s.title||'no title yet')}</div>
    <div class="meta">${esc(base(s.cwd)||'—')}${s.gitBranch?` <span class="sep">·</span> <span class="br">${esc(s.gitBranch)}</span>`:''}${s.model?` <span class="sep">·</span> ${esc(s.model)}`:''}${s.account?` <span class="sep">·</span> ${esc(s.account)}`:''}</div>
    ${tool?`<div class="tool"><span class="tn">${esc(tool.name)}</span><span class="td">${esc(tool.detail||'')}</span><span class="ta t-ago" data-at="${+tool.at||0}"></span></div>`:''}
    ${stats.length?`<div class="stats">${stats.join('')}</div>`:''}
    <div class="foot">${prs}<details class="dl"><summary>export</summary><div class="dl-menu"><a href="/export?session=${q}&amp;format=jsonl" download>Raw JSONL</a><a href="/export?session=${q}&amp;format=md" download>Markdown</a></div></details></div>`
}

function renderCounts(){
  const c={busy:0,idle:0,shell:0,ended:0}
  for(const s of S.values())c[stat(s)]++
  $('counts').innerHTML=`<span class="badge${c.busy?' working':''}"><span class="dot"></span>${c.busy} busy</span><span class="badge">${c.idle} idle</span>${c.shell?`<span class="badge">${c.shell} shell</span>`:''}<span class="badge">${c.ended} ended</span>`
}

function renderTimes(){for(const el of document.querySelectorAll('.t-ago'))el.textContent=ago(+el.dataset.at)}

function render(){
  const list=[...S.values()].sort((a,b)=>RANK[stat(a)]-RANK[stat(b)]||(+b.lastEventAt||0)-(+a.lastEventAt||0))
  const grid=$('sessions'),seen=new Set()
  for(const s of list){
    seen.add(s.id)
    let c=cards.get(s.id)
    if(!c){c={el:document.createElement('article'),html:''};c.el.dataset.id=s.id;cards.set(s.id,c)}
    const html=cardHtml(s)
    if(c.html!==html){c.el.innerHTML=html;c.html=html}
    const cls='card '+stat(s)
    if(c.el.className!==cls)c.el.className=cls
  }
  for(const [id,c] of cards)if(!seen.has(id)){c.el.remove();cards.delete(id)}
  let ref=grid.firstChild
  for(const s of list){const el=cards.get(s.id).el;if(ref===el)ref=el.nextSibling;else grid.insertBefore(el,ref)}
  $('empty').style.display=list.length?'none':''
  renderCounts();renderTimes()
}

const link=$('link')
const es=new EventSource('/events')
es.onopen=()=>{link.classList.remove('off');link.textContent='watching'}
es.onerror=()=>{link.classList.add('off');link.textContent='reconnecting…'}
es.onmessage=e=>{
  let d;try{d=JSON.parse(e.data)}catch{return}
  if(!d.partial){S=new Map();$('empty').textContent='No agent sessions on this machine.';if(d.host)$('host').textContent=d.host+(d.port?':'+d.port:'')}
  for(const s of d.sessions||[])if(s&&s.id)S.set(s.id,d.partial?{...(S.get(s.id)||{}),...s}:s)
  render()
}
setInterval(renderTimes,1000)
</script>
</body>
</html>
