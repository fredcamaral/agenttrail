<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="Every coding-agent session on this machine, live.">
<title>agenttrail</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%201000%201000%22%3E%3Crect%20width=%221000%22%20height=%221000%22%20rx=%22210%22%20fill=%22%2317171a%22/%3E%3Cg%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-width=%2292%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%3E%3Cpath%20d=%22M180%20810C278%20617%20363%20405%20445%20180C467%20120%20535%20120%20560%20180C650%20414%20733%20625%20820%20810%22/%3E%3Cpath%20d=%22M180%20810C300%20704%20430%20646%20610%20590%22/%3E%3C/g%3E%3Ccircle%20cx=%22180%22%20cy=%22810%22%20r=%2274%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%22610%22%20cy=%22590%22%20r=%2274%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%22820%22%20cy=%22810%22%20r=%2274%22%20fill=%22%23fff%22/%3E%3Ccircle%20cx=%22820%22%20cy=%22810%22%20r=%2238%22%20fill=%22%23FFB21A%22/%3E%3C/svg%3E">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('at-theme')==='light'?'light':'dark'}catch{document.documentElement.dataset.theme='dark'}</script>
<style>
/* Type scale: five steps, no ad-hoc sizes. Spacing is a 4px scale, bar a few
   optical insets and the touch-target floors the phone query needs. */
:root{--fs-0:10px;--fs-1:11px;--fs-2:12px;--fs-3:13px;--fs-4:14px;--card-min:320px;
--font:"Geist","Manrope",sans-serif;--mono:"Geist Mono",monospace;--ease:cubic-bezier(.32,.72,0,1);--ease-out:cubic-bezier(.23,1,.32,1)}
/* Both themes define every colour token; text tints clear 4.5:1 on their surface. */
:root{color-scheme:dark;--bg:#000;--surface:#1f1f1f;--raised:#1f1f1f;--hover:#272727;--line:#313131;--text:#fff;--soft:#d1d1d1;--dim:#9b9b9b;--faint:#8a8a8a;--accent:#e9a23b;--accent-bg:#2e220f;--danger:#e0817d;--success:#7aa36a;--complete-text:#70a784;--complete-weight:500;--working-border:#2f4a39;--working-bg:#141f18;--watch-ring:#172015;--overlay:#181818;--shadow-soft:0 1px 2px rgb(0 0 0/.55),0 8px 22px rgb(0 0 0/.4);--shadow-strong:0 24px 70px rgb(0 0 0/.65);--agent-openai:#e8e8ea}
:root[data-theme="light"]{color-scheme:light;--bg:#fff;--surface:rgb(0 0 0/.05);--raised:#fff;--hover:rgb(0 0 0/.07);--line:rgb(0 0 0/.14);--text:#000;--soft:rgb(0 0 0/.78);--dim:#5f5f5f;--faint:rgb(0 0 0/.58);--accent:color-mix(in srgb,#e9a23b 64%,#000);--accent-bg:rgb(233 162 59/.16);--danger:#b3403c;--success:#3f7f57;--complete-text:#3f7f57;--complete-weight:600;--working-border:rgb(63 127 87/.42);--working-bg:rgb(63 127 87/.09);--watch-ring:rgb(63 127 87/.14);--overlay:#fbfaf8;--shadow-soft:0 1px 2px rgb(0 0 0/.05),0 6px 18px rgb(0 0 0/.07);--shadow-strong:0 20px 60px rgb(0 0 0/.18);--agent-openai:#313131}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);scrollbar-color:var(--line) transparent}
body{min-width:320px;min-height:100dvh;background:var(--bg);color:var(--text);font:400 var(--fs-4)/20px var(--font);letter-spacing:-.01em;accent-color:var(--accent);caret-color:var(--accent);overflow-wrap:break-word}
::selection{background:var(--accent-bg);color:var(--text)}
:root:has(dialog[open]){overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.025;z-index:4;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}
button{font:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;min-height:64px;padding:12px 24px;background:var(--bg);border-bottom:1px solid var(--hover)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none;width:28px;height:28px;border-radius:7px}
.brand-name{font-weight:600}
.brand-host{color:var(--dim);font:400 var(--fs-2)/16px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status,#counts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status{justify-self:end;justify-content:flex-end}
.badge{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;color:var(--dim);white-space:nowrap;font:400 var(--fs-2)/16px var(--font);font-variant-numeric:tabular-nums}
.badge.working{border-color:var(--working-border);color:var(--success);background:var(--working-bg)}
.badge.working .dot{background:var(--success);animation:working-pulse 1.6s ease-in-out infinite}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
@keyframes working-pulse{50%{opacity:.35}}
.watching{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:var(--fs-2)}
.watching:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px var(--watch-ring)}
.watching.off{color:var(--danger)}
.watching.off:before{background:var(--danger);box-shadow:none;animation:working-pulse 1s ease-in-out infinite}
.theme-toggle{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--dim);cursor:pointer;font:500 var(--fs-2)/16px var(--font);transition:color 250ms var(--ease-out),background 250ms var(--ease-out)}
.theme-toggle:hover{color:var(--text);background:var(--hover)}
.theme-toggle:active{transform:scale(.98)}
.theme-track{position:relative;width:32px;height:16px;border-radius:8px;background:var(--hover);box-shadow:inset 0 0 0 1px var(--line);transition:background 250ms var(--ease-out)}
.theme-thumb{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:4px;background:var(--dim);transition:transform 250ms var(--ease-out),background 250ms var(--ease-out)}
:root[data-theme="light"] .theme-track{background:var(--accent-bg)}
:root[data-theme="light"] .theme-thumb{transform:translateX(16px);background:var(--accent)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--card-min)),1fr));padding:20px 24px 64px}
/* flex column so every card's action row lands on the same baseline in a row */
.card{display:flex;flex-direction:column;position:relative;padding:12px 12px 12px 28px;border:1px solid var(--line);border-radius:14px;background:var(--overlay);box-shadow:var(--shadow-soft);cursor:pointer;animation:reveal 420ms var(--ease) both;transition:border-color 200ms var(--ease-out),background 200ms var(--ease-out)}
.card:hover{border-color:var(--faint);background:var(--raised)}
/* status reads twice: a colour rail for scanning, a word for meaning */
.card:before{content:"";position:absolute;left:12px;top:17px;width:6px;height:6px;border-radius:50%;background:var(--faint)}
.card.busy{border-color:var(--working-border)}
.card.busy:before{background:var(--success);animation:working-pulse 1.6s ease-in-out infinite}
.card.idle:before{background:var(--accent)}
.card.shell:before{background:var(--dim)}
.card.ended{background:transparent;border-color:var(--hover);box-shadow:none}
.card.ended .name,.card.ended .title{color:var(--dim)}
.card.ended .meta,.card.ended .tool{color:var(--faint)}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-head{display:flex;align-items:center;gap:8px;min-width:0}
.name{flex:1;min-width:0;font-weight:600;font-size:var(--fs-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src{display:inline-flex;flex:none;align-items:center;justify-content:center;width:18px;height:18px;border-radius:6px;background:var(--surface);font:600 var(--fs-0)/18px var(--mono)}
.src svg{width:12px;height:12px}
.st{flex:none;color:var(--faint);font:600 var(--fs-0)/16px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.card.busy .st{color:var(--success)}
.card.idle .st{color:var(--accent)}
.card.shell .st{color:var(--dim)}
/* one line, whatever fills it: the summary, the last prompt, or the title */
.title{display:flex;gap:8px;align-items:baseline;margin-top:8px;color:var(--text);font-size:var(--fs-3);line-height:18px}
.title.none{color:var(--dim)}
.title .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title .a{flex:none;margin-left:auto;color:var(--faint);font:400 var(--fs-1)/16px var(--mono);font-variant-numeric:tabular-nums}
.meta{margin-top:4px;color:var(--dim);font:400 var(--fs-1)/16px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br{color:var(--accent)}
.sep{color:var(--faint)}
/* always rendered, so a tool starting or ending never resizes the card */
.tool{display:flex;gap:8px;align-items:baseline;margin-top:4px;min-height:16px;color:var(--dim);font:400 var(--fs-1)/16px var(--mono);overflow:hidden;white-space:nowrap}
.tool.none{color:var(--faint)}
.tool .tn{color:var(--accent);flex:none}
.tool .td{overflow:hidden;text-overflow:ellipsis}
.tool .ta{margin-left:auto;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;padding-top:8px;border-top:1px solid var(--hover);color:var(--faint);font:400 var(--fs-1)/16px var(--mono);font-variant-numeric:tabular-nums}
.stats b{color:var(--soft);font-weight:600}
.stats .ok{color:var(--complete-text);font-weight:var(--complete-weight)}
.stats .run{color:var(--success)}
.foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;min-height:24px}
.pr{padding:1px 8px;border-radius:999px;color:var(--accent);background:var(--accent-bg);font:600 var(--fs-1)/16px var(--mono);text-decoration:none}
.pr:hover{color:var(--text)}
.dl{position:relative}
.foot .act{margin-left:auto}
.dl>summary{display:flex;align-items:center;gap:8px;padding:2px 8px;border:1px solid var(--line);border-radius:8px;color:var(--dim);cursor:pointer;list-style:none;font:400 var(--fs-1)/16px var(--font)}
summary::-webkit-details-marker{display:none}
.dl>summary:hover{color:var(--text);background:var(--hover)}
.dl-menu{position:absolute;right:0;bottom:calc(100% + 8px);z-index:2;display:flex;flex-direction:column;min-width:148px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--raised);box-shadow:var(--shadow-strong)}
.dl-menu a{padding:8px 12px;border-radius:6px;color:var(--soft);text-decoration:none;font-size:var(--fs-2)}
.dl-menu a:hover{color:var(--text);background:var(--hover)}
.act{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--dim);cursor:pointer;font:500 var(--fs-2)/16px var(--font);transition:color 160ms var(--ease-out),background 160ms var(--ease-out)}
.act:hover{color:var(--text);background:var(--hover)}
.act.on{color:var(--text);border-color:var(--accent);background:var(--accent-bg)}
.card .act{min-height:0;padding:2px 8px;font-weight:400;font-size:var(--fs-1)}
/* one authored moment: the sheet rises, the backdrop fades, both reversible */
dialog{width:min(760px,100%);max-height:88dvh;margin:auto;padding:0;border:1px solid var(--line);border-radius:16px;background:var(--overlay);color:var(--text);box-shadow:var(--shadow-strong);opacity:0;transform:translateY(10px) scale(.99);transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out),overlay 220ms allow-discrete,display 220ms allow-discrete}
dialog[open]{opacity:1;transform:none}
dialog::backdrop{background:rgb(0 0 0/.6);backdrop-filter:blur(2px);opacity:0;transition:opacity 220ms var(--ease-out),overlay 220ms allow-discrete,display 220ms allow-discrete}
dialog[open]::backdrop{opacity:1}
@starting-style{dialog[open]{opacity:0;transform:translateY(10px) scale(.99)}dialog[open]::backdrop{opacity:0}}
.sheet{display:flex;flex-direction:column;max-height:88dvh}
.sheet-head{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 16px;border-bottom:1px solid var(--hover)}
.sheet-head b{flex:none;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-head .sub{flex:1;min-width:0;color:var(--dim);font:400 var(--fs-1)/16px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-head .act{flex:none}
.sheet-body{padding:16px 16px 20px;overflow:auto;overscroll-behavior:contain}
/* inside the sheet a group is bounded by its own heading, so a rule above the
   numbers would tie them to the session below instead of the one above */
.sheet-body .stats{border-top:0;padding-top:0}
.sec{margin-top:20px}
.sec:first-child{margin-top:0}
.sec>h2{margin-bottom:4px;color:var(--faint);font:600 var(--fs-0)/16px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px solid var(--hover);font:400 var(--fs-1)/17px var(--mono);min-width:0}
/* the guide column IS the indent: box-drawing glyphs in the row's own mono font,
   so depth costs no second mechanism and the spaces must survive collapsing */
.row .g{flex:none;color:var(--faint);white-space:pre}
summary.row{cursor:pointer;list-style:none}
summary.row:hover{background:var(--hover)}
.row .d{flex:none;align-self:flex-start;width:6px;height:6px;margin-top:5px;border-radius:50%;background:var(--faint)}
.row.running .d{background:var(--success);animation:working-pulse 1.6s ease-in-out infinite}
/* hollow reads as finished even in a still frame, where the pulse cannot */
.row.done .d{background:transparent;box-shadow:inset 0 0 0 2px var(--complete-text)}
.row .k{flex:none;color:var(--accent)}
.row .v{color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{flex:none;margin-left:auto;padding-left:8px;color:var(--faint);font-variant-numeric:tabular-nums}
.row.done .v{color:var(--dim)}
button.row{width:100%;border:0;border-top:1px solid var(--hover);background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
button.row:hover{background:var(--hover)}
.row.big{font:400 var(--fs-3)/18px var(--font);letter-spacing:-.01em}
.row.big .v{white-space:normal}
.hint{padding:8px 0;color:var(--faint);font:400 var(--fs-1)/17px var(--mono);overflow-wrap:anywhere}
/* a workflow blurb is two lines of context, never a wall of prose that pushes
   the agents under it off the screen */
.c2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;white-space:normal}
/* the phone's answer to the sheet: the detail unfolds inside the card itself */
.exp{margin-top:8px;padding-top:8px;border-top:1px solid var(--hover)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input{min-height:32px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--soft);font:400 var(--fs-2)/16px var(--mono);color-scheme:inherit}
.dls{display:flex;flex-wrap:wrap;gap:8px}
.dls a{padding:4px 12px;border:1px solid var(--line);border-radius:8px;color:var(--soft);text-decoration:none;font-size:var(--fs-2)}
.dls a:hover{color:var(--text);background:var(--hover)}
/* "nothing here" is a designed state, on a fresh machine and in a quiet window alike */
.empty{display:grid;gap:8px;justify-items:center;padding:80px 24px;text-align:center}
.empty b{font:600 var(--fs-4)/22px var(--font);color:var(--text)}
.empty span{max-width:46ch;color:var(--dim);font-size:var(--fs-2);line-height:18px}
.sheet-body .empty{padding:44px 8px}
@media(min-width:1400px){.grid{--card-min:340px;gap:16px;padding:24px 32px 72px}}
@media(max-width:720px){
.topbar{grid-template-columns:minmax(0,1fr);gap:8px}.status{justify-self:start}
.grid{padding:16px 12px 48px}.empty{padding:56px 20px}
dialog{width:100%;max-width:100%;max-height:100dvh;height:100dvh;border:0;border-radius:0}
.sheet{max-height:100dvh;height:100dvh}
.sheet-body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
/* every control a thumb can reach clears 44px, not just the ones on a card */
.act,.card .act,.dl>summary,.dls a,.dl-menu a{display:inline-flex;align-items:center;min-height:44px;padding:4px 12px}
.theme-toggle,.bar input{min-height:44px}
.pr{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:12px}
button.row,summary.row{padding:14px 0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><svg viewBox="0 0 1000 1000" aria-hidden="true"><rect width="1000" height="1000" rx="210" fill="#17171a"/><g fill="none" stroke="#fff" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"><path d="M180 810C278 617 363 405 445 180C467 120 535 120 560 180C650 414 733 625 820 810"/><path d="M180 810C300 704 430 646 610 590"/></g><circle cx="180" cy="810" r="74" fill="#fff"/><circle cx="610" cy="590" r="74" fill="#fff"/><circle cx="820" cy="810" r="74" fill="#fff"/><circle cx="820" cy="810" r="38" fill="#FFB21A"/></svg><span class="brand-name">agenttrail</span><span class="brand-host" id="host"></span></div>
  <div class="status"><span id="counts"></span><button class="act" id="digest-btn" type="button" onclick="openDigest()">digest</button><button class="theme-toggle" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Use light theme" onclick="toggleTheme()"><span id="theme-toggle-label">Light</span><span class="theme-track" aria-hidden="true"><span class="theme-thumb"></span></span></button><span class="watching" id="link">watching</span></div>
</header>
<main class="grid" id="sessions" aria-label="Agent sessions"></main>
<div class="empty" id="empty"><b>Connecting to the monitor</b><span>Waiting for the first snapshot from the daemon on this machine.</span></div>
<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet">
    <div class="sheet-head"><b id="sheet-title"></b><span class="sub" id="sheet-sub"></span><button class="act" type="button" onclick="closeSheet()" aria-label="Close (esc)">esc</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</dialog>
<script>
const $=id=>document.getElementById(id)
function syncTheme(){const light=document.documentElement.dataset.theme==='light',toggle=$('theme-toggle'),label=$('theme-toggle-label');if(toggle){toggle.setAttribute('aria-checked',String(light));toggle.setAttribute('aria-label',light?'Use dark theme':'Use light theme')}if(label)label.textContent=light?'Dark':'Light';document.querySelector('meta[name="theme-color"]')?.setAttribute('content',light?'#fff':'#000')}
function toggleTheme(){const next=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=next;try{localStorage.setItem('at-theme',next)}catch{}syncTheme()}
syncTheme()
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const ago=ms=>{const s=Math.max(0,Math.round((Date.now()-ms)/1000));return s<60?`${s}s`:s<3600?`${Math.round(s/60)} min`:s<86400?`${Math.round(s/3600)} h`:`${Math.round(s/86400)} d`}
const AGENT_COLORS={claude:'#d97757',codex:'var(--agent-openai)',opencode:'#5b7fd6'}

// own-property lookups only: a daemon string like "constructor" must not
// resolve to an inherited prototype value and leak into markup or a count.
const own=(o,k)=>Object.hasOwn(o,String(k))?o[String(k)]:null
function agentIcon(n){return own(AGENT_ICONS,String(n).toLowerCase())}
function agentGlyph(n){return String(n||'?')[0].toUpperCase()}
function agentColor(n){const k=String(n||'').toLowerCase(),c=own(AGENT_COLORS,k);if(c)return c;let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))%360;return`hsl(${h} 45% 45%)`}
const RANK={busy:0,idle:1,shell:2,ended:3}
const stat=s=>Object.hasOwn(RANK,String(s.status))?String(s.status):'ended'
const num=(v,d)=>v!=null&&Number.isFinite(+v)?+v:d
const base=p=>String(p??'').replace(/\/+$/,'').split('/').pop()
const money=n=>'$'+(n>=100?String(Math.round(n)):n.toFixed(2))
const href=u=>/^https?:\/\//i.test(String(u??''))?String(u):'#'
// An explicit null transcriptPath means the adapter has no file to serve
// (opencode sessions); an absent field is unknown and keeps the links.
const hasFile=s=>s.transcriptPath!==null
let S=new Map()
const cards=new Map()

// Icon only: on a machine running one source, the word was the least
// informative pixel on the card. The name stays reachable as a tooltip.
function srcBadge(src){const c=agentColor(src),ic=agentIcon(src)
  return`<span class="src" style="color:${c}" title="${esc(src||'unknown source')}">${ic?`<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="${c}" d="${ic}"/></svg>`:esc(agentGlyph(src))}</span>`}

// A birth name goes stale on day three; repo · branch is what the session still
// is. It only wins when the adapter actually derived one — otherwise the old
// name is still the best label we have.
function canon(s){
  const c=s.canonical
  if(!c||!c.repo)return null
  const b=c.branch&&c.branch!=='HEAD'?String(c.branch):''
  return{repo:String(c.repo),branch:b,text:String(c.repo)+(b?' · '+b:'')}
}
// What the session is doing, in one line, best evidence first: the LLM summary,
// then what the human last asked for, then the title minted at birth.
function headline(s){
  const sum=s.summary&&s.summary.text?String(s.summary.text):''
  if(sum)return{text:sum,at:+(s.summary.at)||0}
  const lp=s.lastPrompt&&s.lastPrompt.text?String(s.lastPrompt.text):''
  return{text:lp||String(s.title||''),at:0}
}

function cardHtml(s){
  const st=stat(s),c=canon(s),nm=c?c.text:String(s.name||s.title||s.id)
  const line=headline(s),open=expanded(s)   // expanded() is defined with the panel it belongs to
  const tool=s.currentTool||(s.recentTools||[])[0]
  const todos=s.todos||[],tdone=todos.filter(t=>t.status==='completed').length
  // list views trim agents[]; agentCount/agentsRunning carry the honest totals
  const agents=s.agents||[]
  const an=num(s.agentCount,agents.length),arun=num(s.agentsRunning,agents.filter(a=>a.status==='running').length)
  const stats=[]
  if(s.cost&&Number.isFinite(+s.cost.totalUSD))stats.push(`<span><b>${money(+s.cost.totalUSD)}</b></span>`)
  if(+s.turns>0)stats.push(`<span><b>${+s.turns}</b> turns</span>`)
  if(todos.length)stats.push(`<span${tdone===todos.length?' class="ok"':''}>todos <b>${tdone}/${todos.length}</b></span>`)
  if(an)stats.push(`<span>agents <b>${an}</b>${arun?` <span class="run">${arun} running</span>`:''}</span>`)
  if(+s.startedAt>0)stats.push(`<span title="since the session started">up <span class="t-ago" data-at="${+s.startedAt}"></span></span>`)
  if(+s.lastEventAt>0)stats.push(`<span title="since the last transcript event">seen <span class="t-ago" data-at="${+s.lastEventAt}"></span></span>`)
  const prs=(s.prs||[]).slice(0,4).map(p=>`<a class="pr" href="${esc(href(p.url))}" target="_blank" rel="noopener noreferrer" title="${esc(p.repo||'')}">#${esc(p.number)}</a>`).join('')
  const q=encodeURIComponent(String(s.id??''))
  // the head already says repo · branch when canonical resolved, so the meta
  // line spends its width on what is left instead of saying it twice
  const dot=' <span class="sep">·</span> '
  const mparts=[]
  if(!c)mparts.push(esc(base(s.cwd)||'—')+(s.gitBranch?`${dot}<span class="br">${esc(s.gitBranch)}</span>`:''))
  if(s.model)mparts.push(esc(s.model))
  if(s.account)mparts.push(esc(s.account))
  const nmHtml=c?`${esc(c.repo)}${c.branch?`${dot}<span class="br">${esc(c.branch)}</span>`:''}`:esc(nm)
  return`<div class="card-head">${srcBadge(s.source)}<span class="name" title="${esc(nm)}">${nmHtml}</span><span class="st">${esc(st)}</span></div>
    <div class="title${line.text?'':' none'}" title="${esc(line.text)}"><span class="v">${esc(line.text||'no title yet')}</span>${line.at>0?`<span class="a t-ago" data-at="${line.at}"></span>`:''}</div>
    ${mparts.length?`<div class="meta" title="${esc(s.cwd||'')}">${mparts.join(dot)}</div>`:''}
    <div class="tool${tool?'':' none'}"${tool&&tool.detail?` title="${esc(tool.detail)}"`:''}>${tool?`<span class="tn">${esc(tool.name)}</span><span class="td">${esc(tool.detail||'')}</span><span class="ta t-ago" data-at="${+tool.at||0}"></span>`:'<span class="td">—</span>'}</div>
    ${stats.length?`<div class="stats">${stats.join('')}</div>`:''}
    ${open?expHtml(s):''}
    <div class="foot">${prs}<button class="act" type="button" data-open aria-expanded="${open}">details</button>${hasFile(s)?`<details class="dl"><summary>export</summary><div class="dl-menu"><a href="/export?session=${q}&amp;format=jsonl" download>Raw JSONL</a><a href="/export?session=${q}&amp;format=md" download>Markdown</a></div></details>`:''}</div>`
}

function renderCounts(){
  const c={busy:0,idle:0,shell:0,ended:0}
  for(const s of S.values())c[stat(s)]++
  // a machine with nothing running says so once, in the middle, not as four zeros
  if(!S.size)return void($('counts').innerHTML='')
  $('counts').innerHTML=`<span class="badge${c.busy?' working':''}"><span class="dot"></span>${c.busy} busy</span><span class="badge">${c.idle} idle</span>${c.shell?`<span class="badge">${c.shell} shell</span>`:''}<span class="badge">${c.ended} ended</span>`
}

function renderTimes(){for(const el of document.querySelectorAll('.t-ago'))el.textContent=ago(+el.dataset.at)}

function render(){
  const list=[...S.values()].sort((a,b)=>RANK[stat(a)]-RANK[stat(b)]||(+b.lastEventAt||0)-(+a.lastEventAt||0))
  const grid=$('sessions'),seen=new Set()
  for(const s of list){
    seen.add(s.id)
    let c=cards.get(s.id)
    if(!c){c={el:document.createElement('article'),html:''};c.el.dataset.id=s.id;cards.set(s.id,c)}
    const html=cardHtml(s)
    if(c.html!==html){c.el.innerHTML=html;c.html=html}
    const cls='card '+stat(s)
    if(c.el.className!==cls)c.el.className=cls
  }
  for(const [id,c] of cards)if(!seen.has(id)){c.el.remove();cards.delete(id)}
  let ref=grid.firstChild
  for(const s of list){const el=cards.get(s.id).el;if(ref===el)ref=el.nextSibling;else grid.insertBefore(el,ref)}
  $('empty').style.display=list.length?'none':''
  renderCounts();renderTimes()
}

// ---- shared sheet: one dialog, two panels (session detail, digest) --------
// <dialog> is doing the keyboard work: showModal() gives esc-to-close, focus
// containment and the backdrop for free. Listeners go through on() so a stub
// DOM without addEventListener degrades to no-ops instead of throwing.
const on=(el,ev,fn,cap)=>{if(el&&el.addEventListener)el.addEventListener(ev,fn,!!cap)}
const txt=(id,v)=>{const el=$(id);if(el)el.textContent=v}
// A tick every second must not rewrite an unchanged panel. This only covers
// the panel that did not move: a busy session's timestamps change every tick,
// so what survives THAT repaint is remembered separately (WFOPEN).
let sheetHtml=''
function paint(html){const b=$('sheet-body');if(!b)return;if(sheetHtml!==html){b.innerHTML=html;sheetHtml=html}renderTimes()}
const dur=ms=>{const s=Math.max(0,Math.round(+ms/1000));return s<60?`${s}s`:s<3600?`${Math.round(s/60)} min`:`${(s/3600).toFixed(1)} h`}
const when=ms=>{try{return new Date(ms).toLocaleString()}catch{return String(ms)}}
const sheet=$('sheet')
let DET=null,DG=null,fetching=false,refetch=false

// ---- inline expansion: the phone's answer to the sheet ---------------------
// A modal on top of a 320px card hides the thing you tapped. Under 760px the
// card unfolds in place instead; the sheet stays for screens that fit it.
// The tree is drawn from the SSE session, so it keeps ticking with the grid —
// only the mini-log needs the /session fetch the sheet already performs.
const wide=()=>{try{return matchMedia('(min-width:760px)').matches}catch{return false}}
const expanded=s=>!!(DET&&DET.inline&&DET.id===s.id)
const hhmm=ms=>{const d=new Date(+ms);return +ms>0&&!isNaN(d)?d.toTimeString().slice(0,5):'--:--'}
// timeline .data is opaque by contract, so the kinds we DO know are formatted
// as what they mean — a turn is how long it took, a cost is money — and the
// rest read the likely shapes, falling back to raw JSON rather than dropping a
// row the daemon thought worth sending.
const tlText=(k,d)=>d==null?'':typeof d!=='object'?String(d)
  :k==='turn'&&Number.isFinite(d.durationMs)?dur(d.durationMs)
  :k==='cost'&&Number.isFinite(d.totalUSD)?money(d.totalUSD)
  :String(d.text??d.title??(d.number!=null?'#'+d.number:JSON.stringify(d)))

// `anc` is one flag per ancestor: true while that ancestor still has children
// below this row, which is what keeps its line drawn. An 8px indent read as
// nothing on a phone; a glyph reads as structure at any width.
const guide=(anc,last)=>`<span class="g">${anc.map(c=>c?'│  ':'   ').join('')}${last?'└─':'├─'}</span>`
// A row's guide is decided by what comes AFTER it, so the flags are read
// backwards off the depth sequence. That also covers the rows treeRows appends
// out of band — orphans, cycle survivors — without walking the tree twice.
function guided(rows){
  const open=[],out=[]
  for(let i=rows.length-1;i>=0;i--){
    const d=rows[i].depth
    out[i]={...rows[i],last:!open[d],anc:Array.from({length:d},(_,k)=>!!open[k])}
    open.length=d+1
    open[d]=true
  }
  return out
}
// The session is the root of its own tree: what it still is, and what it is
// doing right now. Nothing above it, so it carries no guide.
function rootRow(s){
  const c=canon(s),st=stat(s),t=st==='busy'?s.currentTool:null
  return`<div class="row ${st==='busy'?'running':st==='ended'?'done':''}"><span class="d"></span><span class="k">${esc(c?c.text:String(s.name||s.title||s.id))}</span><span class="v">${t?esc(t.name)+(t.detail?' '+esc(t.detail):''):''}</span><span class="r">${t&&+t.at>0?`<span class="t-ago" data-at="${+t.at}"></span>`:''}</span></div>`
}
function agentLine(a,anc,last){
  const t=a&&a.currentTool
  return`<div class="row running">${guide(anc,last)}<span class="d"></span><span class="k">${esc((a&&(a.description||a.type||a.agentId))||'agent')}</span><span class="v">${t?esc(t.name)+(t.detail?' '+esc(t.detail):''):'—'}</span><span class="r">${t&&+t.at>0?`<span class="t-ago" data-at="${+t.at}"></span>`:''}</span></div>`
}
// One dim line, not a list: on a 320px card the finished agents are context for
// the ones still moving, and listing them buries what the tree is being read for.
const doneRow=(anc,last,n)=>`<div class="row done">${guide(anc,last)}<span class="d"></span><span class="v">${n} done</span></div>`
// Same idiom for what the cap dropped: those rows are still RUNNING, so they
// belong nowhere near the done count — a card that just stops at six is a card
// that lies about how much is moving.
const moreRow=(anc,last,n)=>`<div class="row done">${guide(anc,last)}<span class="d"></span><span class="v">+${n} more</span></div>`
function wfNode(w,run,done,more,last){
  const p=w.phase,anc=[!last],n=run.length+(more?1:0)+(done?1:0)
  const prog=p&&p.current?`${esc(p.current)} ${+p.done||0}/${+p.total||0}`:`${+w.done||0}/${+w.agents||0} done`
  return`<div class="row running">${guide([],last)}<span class="d"></span><span class="v">${esc(w.name||w.id)}</span><span class="r">${prog}</span></div>`
    +(w.description?`<div class="hint c2">${esc(w.description)}</div>`:'')
    +run.map((a,i)=>agentLine(a,anc,i===n-1)).join('')
    +(more?moreRow(anc,!done,more):'')
    +(done?doneRow(anc,true,done):'')
}
const AKIDS=6
function inlineTree(s){
  // /session carries every agent; an SSE session carries only each workflow's
  // running slice. The choice between them is ONE decision for the whole
  // snapshot — picking per list reads counts off the fetch and children off the
  // live session, and hides the agents that are actually running. The fetch wins
  // only once it has landed, is still tracked, and actually carries rows;
  // otherwise the live session draws the tree, as it does before the round trip.
  const arr=x=>Array.isArray(x)?x:[]
  const d=DET&&DET.full&&!DET.gone&&DET.data&&(arr(DET.data.agents).length||arr(DET.data.workflows).length)?DET.data:null
  const full=!!d,src=d||s
  const agents=arr(src.agents).filter(a=>a&&a.agentId!=null)
  const wfs=[]
  for(const w of arr(src.workflows)){
    if(!w||w.id==null)continue
    const mine=full?agents.filter(a=>a.workflowId!=null&&String(a.workflowId)===String(w.id)):(w.runningAgents||[])
    const run=full?mine.filter(a=>a.status==='running'):mine
    // a finished workflow belongs in the log below, not in a tree read for now
    if(+w.running>0||run.length)wfs.push([w,run.slice(0,AKIDS),full?mine.length-run.length:Math.max(0,+w.done||0),Math.max(0,run.length-AKIDS)])
  }
  const lone=agents.filter(a=>a.workflowId==null),lrun=lone.filter(a=>a.status==='running')
  const ldone=full?lone.length-lrun.length:0
  const kids=[]
  for(const [w,run,done,more] of wfs)kids.push(last=>wfNode(w,run,done,more,last))
  for(const a of lrun.slice(0,AKIDS))kids.push(last=>agentLine(a,[],last))
  if(lrun.length>AKIDS)kids.push(last=>moreRow([],last,lrun.length-AKIDS))
  if(ldone)kids.push(last=>doneRow([],last,ldone))
  return`<div class="sec"><h2>tree</h2>${rootRow(s)}${kids.map((f,i)=>f(i===kids.length-1)).join('')}</div>`
}
const LOGROWS=40
function miniLog(){
  if(!DET)return''
  const tl=DET.data&&Array.isArray(DET.data.timeline)?DET.data.timeline:null
  const rows=!tl?(DET.full?'<div class="hint">nothing in the last 24h</div>':'<div class="hint">loading…</div>')
    :!tl.length?'<div class="hint">nothing in the last 24h</div>'
    // oldest-first by contract, so the tail is the newest and stays at the bottom
    :tl.slice(-LOGROWS).map(x=>`<div class="row"><span class="k">${esc(hhmm(x&&x.at))}</span><span class="v">${esc((x&&x.kind)||'')} — ${esc(tlText(x&&x.kind,x&&x.data))}</span></div>`).join('')
  return`<div class="sec"><h2>last 24h</h2>${rows}</div>`
}
function expHtml(s){
  // the head shows one clipped line; here the prompt gets to be whole
  const lp=s.lastPrompt&&s.lastPrompt.text?String(s.lastPrompt.text):''
  return`<div class="exp">${lp?`<div class="sec"><h2>last prompt</h2><div class="hint">${esc(lp)}</div></div>`:''}${inlineTree(s)}${miniLog()}</div>`
}

function openSheet(title,sub){sheetHtml='';txt('sheet-title',title);txt('sheet-sub',sub||'');if(sheet&&sheet.showModal&&!sheet.open)try{sheet.showModal()}catch{}}
function closeSheet(){DET=DG=null;if(sheet&&sheet.close&&sheet.open)sheet.close()}
// close fires on a QUEUED task, so it can land AFTER openDetail() installed the
// inline panel it closed the sheet for — clearing that DET would fold the card
// the thumb just opened. An inline panel is never the dialog's to clear.
on(sheet,'close',()=>{DG=null;if(!(DET&&DET.inline))DET=null})
on(sheet,'click',e=>{if(e.target===sheet)closeSheet()})   // click the backdrop

// ---- session detail -------------------------------------------------------
// Cards carry a trimmed agents[]; the full tree comes from /session/<id>, so
// an SSE tick that touches this session refetches instead of merging a slice.
// sheetMode forces the dialog: a digest row lives inside it already, so drilling
// in must not fold the sheet away to expand a card behind it.
function openDetail(id,sheetMode){
  if(!id)return
  const inline=!sheetMode&&!wide()
  if(inline&&DET&&DET.inline&&DET.id===id){DET=null;render();return}   // second tap folds it back
  DG=null
  if(inline&&sheet&&sheet.close&&sheet.open)sheet.close()   // fires close, which clears DET
  const s=S.get(id)||null
  const c=s&&canon(s)
  DET={id,data:s,full:false,gone:false,inline}
  if(inline)render()
  else{openSheet(c?c.text:(s&&(s.name||s.title))||id,s?`${stat(s)} · ${s.cwd||''}`:'');renderDetail()}
  loadDetail()
}
async function loadDetail(){
  if(!DET)return
  if(fetching){refetch=true;return}
  fetching=true
  const id=DET.id
  try{
    const r=await fetch('/session/'+encodeURIComponent(id))
    const j=r.ok?await r.json():null
    if(DET&&DET.id===id){if(j){DET.data=j;DET.full=true;DET.gone=false}else DET.gone=true;renderDetail()}
  }catch{}
  finally{fetching=false;if(refetch&&DET){refetch=false;loadDetail()}else refetch=false}
}

// parentAgentId is a claim, not a guarantee: a self-parent, a loop or a parent
// that is not in the list must still render exactly once, at depth 0.
function treeRows(list){
  const byId=new Map(),kids=new Map()
  for(const a of list)byId.set(String(a.agentId),a)
  for(const a of byId.values()){
    const id=String(a.agentId),p=a.parentAgentId==null?'':String(a.parentAgentId)
    const key=p&&p!==id&&byId.has(p)?p:''
    if(!kids.has(key))kids.set(key,[])
    kids.get(key).push(a)
  }
  // running first at every level, so the rows the cap drops are finished ones
  for(const l of kids.values())l.sort((a,b)=>(b.status==='running')-(a.status==='running')||(+a.startedAt||0)-(+b.startedAt||0))
  const out=[],seen=new Set()
  const walk=(key,depth)=>{
    for(const a of kids.get(key)||[]){
      const id=String(a.agentId)
      if(seen.has(id))continue
      seen.add(id);out.push({a,depth})
      if(depth<9)walk(id,depth+1)
    }
  }
  walk('',0)
  for(const a of byId.values())if(!seen.has(String(a.agentId))){seen.add(String(a.agentId));out.push({a,depth:0})}
  return out
}
const AROWS=60
// `anc` is where this whole list hangs in the outer tree — under a workflow, or
// straight off the root — and each row's own depth continues from there.
function agentRows(list,anc){
  const all=guided(treeRows(list)),rows=all.slice(0,AROWS)
  const html=rows.map(r=>{
    const a=r.a,run=a.status==='running'
    const age=run?(+a.startedAt>0?`<span class="t-ago" data-at="${+a.startedAt}"></span>`:''):(+a.lastEventAt>+a.startedAt?dur(a.lastEventAt-a.startedAt):'')
    return`<div class="row ${run?'running':'done'}">${guide([...anc,...r.anc],r.last)}<span class="d"></span><span class="k">${esc(a.type||'agent')}</span><span class="v">${esc(a.description||a.agentId)}</span><span class="r">${a.model?esc(a.model)+' · ':''}${age}</span></div>`
  }).join('')
  return html+(all.length>rows.length?`<div class="hint">+${all.length-rows.length} more</div>`:'')
}
// Every repaint of a busy session rewrites this markup (timestamps move), so
// the open/closed state of a workflow group cannot live in the DOM alone.
// WFOPEN remembers what the reader chose; run>0 is only the default.
const WFOPEN=new Map()
function treeSection(s){
  if(!DET.full)return`<div class="sec"><h2>subagents</h2><div class="hint">loading the tree…</div></div>`
  const agents=(s.agents||[]).filter(a=>a&&a.agentId!=null)
  if(!agents.length)return''
  // counts come from the agents actually rendered, so the group header can
  // never disagree with the rows under it
  const wf=new Map(),loose=[]
  for(const w of s.workflows||[])if(w&&w.id!=null)wf.set(String(w.id),{w,list:[]})
  for(const a of agents){
    const k=a.workflowId==null?'':String(a.workflowId)
    if(!k){loose.push(a);continue}
    if(!wf.has(k))wf.set(k,{w:null,list:[]})
    wf.get(k).list.push(a)
  }
  const runs=l=>l.filter(a=>a.status==='running').length
  // a workflow still moving outranks one that finished, at this level too
  const groups=[...wf].sort((a,b)=>(runs(b[1].list)>0)-(runs(a[1].list)>0))
  let out=rootRow(s)
  groups.forEach(([k,g],i)=>{
    const run=runs(g.list),open=WFOPEN.has(k)?WFOPEN.get(k):run>0
    const last=i===groups.length-1&&!loose.length
    out+=`<details class="wf" data-wf="${esc(k)}"${open?' open':''}><summary class="row ${run?'running':'done'}">${guide([],last)}<span class="d"></span><span class="k">workflow</span><span class="v">${esc((g.w&&g.w.name)||k)}</span><span class="r">${g.list.length-run}/${g.list.length} done${run?` · ${run} running`:''}</span></summary>${agentRows(g.list,[!last])}</details>`
  })
  return`<div class="sec"><h2>subagents · ${agents.length}</h2>${out}${loose.length?agentRows(loose,[]):''}</div>`
}
function toolSection(s){
  const cur=s.currentTool,rec=s.recentTools||[]
  if(!cur&&!rec.length)return''
  const row=(t,run)=>`<div class="row ${run?'running':'done'}"><span class="d"></span><span class="k">${esc(t.name)}</span><span class="v">${esc(t.detail||'')}</span><span class="r">${!run&&Number.isFinite(+t.ms)?dur(t.ms)+' · ':''}<span class="t-ago" data-at="${+t.at||0}"></span></span></div>`
  return`<div class="sec"><h2>tools</h2>${cur?row(cur,true):''}${rec.map(t=>row(t,false)).join('')}</div>`
}
function todoSection(s){
  const t=s.todos||[]
  if(!t.length)return''
  const done=t.filter(x=>x.status==='completed').length
  return`<div class="sec"><h2>todos · ${done}/${t.length}</h2>${t.map(x=>{const st=String(x.status||'')
    return`<div class="row big ${st==='completed'?'done':st==='in_progress'?'running':''}"><span class="d"></span><span class="v">${esc(x.content)}</span></div>`}).join('')}</div>`
}
function prSection(s){
  const prs=(s.prs||[]).map(p=>`<a class="pr" href="${esc(href(p.url))}" target="_blank" rel="noopener noreferrer">#${esc(p.number)}${p.repo?' '+esc(p.repo):''}</a>`).join(' ')
  const q=encodeURIComponent(String(s.id??''))
  const dl=hasFile(s)?`<div class="sec"><h2>transcript</h2><div class="dls"><a href="/export?session=${q}&amp;format=jsonl" download>Raw JSONL</a><a href="/export?session=${q}&amp;format=md" download>Markdown</a></div></div>`:''
  return(prs?`<div class="sec"><h2>pull requests</h2><div class="dls">${prs}</div></div>`:'')+dl
}
function renderDetail(){
  if(!DET)return
  if(DET.inline)return render()   // the card is the panel; the grid repaint IS the render
  // A card pre-seeds DET.data from the grid, so a 404 must be checked BEFORE
  // the data: otherwise a dropped session keeps painting its last numbers.
  if(DET.gone){txt('sheet-sub','');return paint(`<div class="hint">the daemon no longer tracks this session</div>`)}
  const s=DET.data
  if(!s)return paint(`<div class="hint">loading…</div>`)
  const st=stat(s)
  const meta=[s.cwd,s.gitBranch,s.model,s.account,s.pid?'pid '+s.pid:'',s.tmux,s.kind,s.version?'v'+s.version:''].filter(Boolean).map(esc).join(' · ')
  const bits=[]
  if(s.cost&&Number.isFinite(+s.cost.totalUSD))bits.push(`<b>${money(+s.cost.totalUSD)}</b>`)
  if(+s.turns>0)bits.push(`<b>${+s.turns}</b> turns`)
  if(s.cost&&(+s.cost.linesAdded||+s.cost.linesRemoved))bits.push(`+${+s.cost.linesAdded||0}/-${+s.cost.linesRemoved||0} lines`)
  if(+s.startedAt>0)bits.push(`up <span class="t-ago" data-at="${+s.startedAt}"></span>`)
  if(+s.lastEventAt>0)bits.push(`seen <span class="t-ago" data-at="${+s.lastEventAt}"></span>`)
  paint(`<div class="sec"><div class="row big ${st==='busy'?'running':st==='ended'?'done':''}"><span class="d"></span><span class="v">${esc(s.title||'no title yet')}</span><span class="r">${esc(st)}</span></div>
    <div class="hint">${meta}</div>${bits.length?`<div class="stats">${bits.map(x=>`<span>${x}</span>`).join('')}</div>`:''}</div>
    ${toolSection(s)}${treeSection(s)}${todoSection(s)}${prSection(s)}`)
}

// ---- digest ---------------------------------------------------------------
// "since I left" is the timestamp of the previous page load, so opening the
// dashboard is what marks the world as seen.
const RANGES=[[0,'since I left'],[2,'2h'],[8,'8h'],[24,'24h']]
const LAST_SEEN=(()=>{try{const v=+localStorage.getItem('at-seen');return v>0?v:0}catch{return 0}})()
try{localStorage.setItem('at-seen',String(Date.now()))}catch{}
const localInput=ms=>{try{return new Date(ms-new Date(ms).getTimezoneOffset()*60000).toISOString().slice(0,16)}catch{return''}}
function openDigest(){
  DET=null
  DG={since:LAST_SEEN||Date.now()-24*3600e3,pick:0,entries:null}
  openSheet('Digest','what happened while you were away')
  renderDigest();loadDigest()
}
function setSince(ms,pick){
  if(!DG||!Number.isFinite(ms))return
  DG.since=Math.round(ms);DG.pick=pick;DG.entries=null
  renderDigest();loadDigest()
}
async function loadDigest(){
  if(!DG)return
  const since=DG.since
  let entries=[]
  try{const r=await fetch('/digest?since='+since);const j=r.ok?await r.json():null;entries=j&&Array.isArray(j.entries)?j.entries:[]}catch{}
  if(DG&&DG.since===since){DG.entries=entries;renderDigest()}
}
function renderDigest(){
  if(!DG)return
  const bar=RANGES.map(([h,label],i)=>`<button class="act${DG.pick===i?' on':''}" type="button" data-i="${i}">${label}</button>`).join('')
    +`<input type="datetime-local" id="dg-when" aria-label="Start of the digest window" value="${localInput(DG.since)}">`
  const e=DG.entries
  const rows=!e?'<div class="hint">loading…</div>'
    :!e.length?'<div class="empty"><b>Nothing moved in this window</b><span>No turns, no cost, no pull requests. Widen the range above to look further back.</span></div>'
    :e.map(x=>{
      const bits=[]
      if(+x.turns>0)bits.push(`<b>${+x.turns}</b> turns`)
      if(Number.isFinite(+x.costDeltaUSD)&&+x.costDeltaUSD>0)bits.push(`<b>+${money(+x.costDeltaUSD)}</b>`)
      if(+x.durationMs>0)bits.push(`${dur(x.durationMs)} working`)
      if(x.started)bits.push('started')
      if(x.ended)bits.push('ended')
      const prs=(x.prs||[]).map(p=>`<a class="pr" href="${esc(href(p.url))}" target="_blank" rel="noopener noreferrer">#${esc(p.number)}</a>`).join(' ')
      // a live session drills in: a real <button>, so it is reachable by
      // keyboard and announced as clickable, not a div with a pointer cursor
      const cls=`row big${x.ended?' done':''}`
      const head=`<span class="d"></span><span class="v">${esc(x.name||x.sessionId)}</span><span class="r">${+x.lastAt>0?`<span class="t-ago" data-at="${+x.lastAt}"></span>`:''}</span>`
      return`<div class="sec">${S.has(x.sessionId)?`<button class="${cls}" type="button" data-sid="${esc(x.sessionId)}">${head}</button>`:`<div class="${cls}">${head}</div>`}
        <div class="hint">${esc(x.title||'no title')}</div>
        ${bits.length||prs?`<div class="stats">${bits.map(v=>`<span>${v}</span>`).join('')}${prs?`<span>${prs}</span>`:''}</div>`:''}</div>`
    }).join('')
  paint(`<div class="bar">${bar}</div><div class="hint">since ${esc(when(DG.since))}${e?` · ${e.length} session${e.length===1?'':'s'}`:''}</div>${rows}`)
}

// One delegated handler for both panels; the range buttons and the clickable
// digest rows live inside markup that is rebuilt on every render.
on($('sheet-body'),'click',e=>{
  const t=e.target
  if(!t||!t.closest)return
  const pick=t.closest('[data-i]')
  if(pick){const i=+pick.dataset.i,h=RANGES[i]&&RANGES[i][0];return setSince(h?Date.now()-h*3600e3:LAST_SEEN||Date.now()-24*3600e3,i)}
  const row=t.closest('[data-sid]')
  if(row&&!t.closest('a'))openDetail(row.dataset.sid,true)
})
// toggle does not bubble — capture phase is how one listener sees them all.
on($('sheet-body'),'toggle',e=>{
  const t=e.target
  if(t&&t.dataset&&t.dataset.wf!=null)WFOPEN.set(String(t.dataset.wf),!!t.open)
},true)
on($('sheet-body'),'change',e=>{
  if(!e.target||e.target.id!=='dg-when')return
  setSince(Date.parse(e.target.value),-1)
})
// A card opens its own detail; links and the export menu keep their behaviour.
on($('sessions'),'click',e=>{
  const t=e.target
  if(!t||!t.closest||t.closest('a,summary,.dl'))return
  const card=t.closest('.card')
  if(card&&card.dataset.id)openDetail(card.dataset.id)
})

const link=$('link')
const es=new EventSource('/events')
es.onopen=()=>{link.classList.remove('off');link.textContent='watching'}
es.onerror=()=>{link.classList.add('off');link.textContent='reconnecting…'}
es.onmessage=e=>{
  let d;try{d=JSON.parse(e.data)}catch{return}
  if(!d.partial){S=new Map();$('empty').innerHTML='<b>No agent sessions here</b><span>Start Claude Code or opencode on this machine and it shows up within a second.</span>';if(d.host)$('host').textContent=d.host+(d.port?':'+d.port:'')}
  for(const s of d.sessions||[])if(s&&s.id)S.set(s.id,d.partial?{...(S.get(s.id)||{}),...s}:s)
  render()
  // Keep an open detail panel live: refetch when this session moved, and on
  // any full snapshot — that is also how a vanished session is discovered.
  if(DET&&(!d.partial||(d.sessions||[]).some(s=>s&&s.id===DET.id)))loadDetail()
}
setInterval(renderTimes,1000)
</script>
